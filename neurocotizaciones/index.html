<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro Cotizaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta premium de trabajo para el dueño que cotiza desde el teléfono; segura, precisa, sin adornos.
   IDEA: una sala de control nocturna del dinero que está por entrar: lo que hay en juego arriba, a quién escribir hoy debajo.
   PICTURE: la app misma en uso; cifra de dinero en juego grande con anillo de progreso del día; la propuesta del cliente como hoja blanca con la marca del negocio.
   COLOUR and TYPE: marca Neuroactiva fija (modo noche): #05070a, cian #00e5ff con brillo suave, verde solo para dinero ganado; Inter.
   LAYOUT: una columna de 820px, pestañas fijas arriba, tarjetas de vidrio; hojas modales para cliente, objeciones y respaldo. */
:root{color-scheme:dark;--bg:#05070a;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(0,229,255,.14);--line2:rgba(255,255,255,.08);--ink:#eaf2f6;--mut:#8b9aa8;--acc:#00e5ff;--accInk:#00161a;--ok:#3ddc84;--warn:#ffb547;--bad:#ff6b5e;--glow:0 0 0 1px rgba(0,229,255,.25),0 8px 30px rgba(0,229,255,.12)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 480px at 92% -160px,rgba(0,229,255,.16),transparent 70%),radial-gradient(700px 420px at -10% 10%,rgba(40,60,255,.10),transparent 70%);background-attachment:fixed;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:820px;margin:0 auto;padding:14px max(4vw,14px) 90px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
header img{width:48px;height:48px;border-radius:14px;object-fit:cover;box-shadow:var(--glow);background:#000}
h1{font-size:20px;margin:0;line-height:1.15;font-weight:800}h2{font-size:18px;margin:24px 0 10px;font-weight:700}h3{font-size:16px;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:13px}
.trial{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0 10px;background:linear-gradient(90deg,rgba(0,229,255,.08),transparent)}
.trial b{color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;position:sticky;top:0;background:rgba(5,7,10,.88);backdrop-filter:blur(10px);z-index:5;scrollbar-width:none}
nav button{flex:none}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--line)}
button.on,.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:700;box-shadow:0 6px 22px rgba(0,229,255,.25)}
.ghost{background:transparent}
.sm{min-height:36px;font-size:13px;padding:0 11px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.hero .card{margin:0}
.big{font-size:clamp(34px,8vw,50px);font-weight:800;line-height:1.05;white-space:nowrap;letter-spacing:-.02em}
.glowtxt{text-shadow:0 0 28px rgba(0,229,255,.35)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{margin:0}.kpi b{display:block;font-size:24px;white-space:nowrap}.kpi span{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tier{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(0,229,255,.14);color:var(--acc);letter-spacing:.02em;vertical-align:middle}
.s-borrador{color:var(--mut)}.s-enviada{color:var(--acc)}.s-negociacion{color:var(--warn)}.s-aceptada{color:var(--ok)}.s-rechazada,.s-vencida{color:var(--bad)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
label,.lb{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(0,229,255,.15)}
select option{background:#0b0f14}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.g4{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,.8fr) minmax(0,.8fr);gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--ink);font-size:15px;margin:0}.chk input{width:22px;min-height:22px;accent-color:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:26px}
.msg{background:rgba(0,0,0,.35);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;white-space:pre-wrap}
.bar{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00b8d4,var(--acc));border-radius:5px}
.note{font-size:13px;color:var(--mut)}
.mg{font-size:13px;font-weight:600;white-space:nowrap}.mg.bad{color:var(--bad)}.mg.ok{color:var(--ok)}.mg.warn{color:var(--warn)}
.ring{width:92px;height:92px;flex:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line2)}
.thumbs button{position:absolute;top:-8px;right:-8px;min-height:26px;width:26px;padding:0;border-radius:50%;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#eaf2f6;color:#05070a;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);z-index:20;overflow-y:auto;padding:16px}
.panel{max-width:640px;margin:0 auto;background:#0b0f14;border:1px solid var(--line);border-radius:20px;padding:20px}
.cele{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(0,0,0,.55);animation:fade .25s}
.cele div{text-align:center;padding:30px 36px;border-radius:24px;background:#0b0f14;border:1px solid var(--line);box-shadow:var(--glow);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.cele .chk2{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--ok);color:#03140a;font-size:40px;font-weight:800;box-shadow:0 0 40px rgba(61,220,132,.5)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fade{from{opacity:0}}
/* Propuesta del cliente (hoja clara con la marca del negocio) */
.paper{max-width:660px;margin:0 auto;background:#fff;color:#0b1016;border-radius:20px;overflow:hidden;color-scheme:light}
.paper .in{padding:20px 22px}
.cover{padding:24px 22px;color:#fff;background:var(--bc,#0b6b7a)}
.cover img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#fff}
.cover h2{margin:14px 0 4px;font-size:24px;line-height:1.15}
.paper h3{font-size:17px;margin:20px 0 8px}
.paper .sub,.paper .note,.paper label{color:#5b6873}
.paper input{background:#f4f7f9;color:#0b1016;border-color:#cfd8df}
.paper button,.paper .btn{background:#f1f4f6;color:#0b1016;border-color:#d7dee4;box-shadow:none}
.paper .pri{background:var(--bc,#0b6b7a);border-color:var(--bc,#0b6b7a);color:#fff}
.opt{display:block;border:2px solid #dbe2e8;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;position:relative;font-size:15px;color:#0b1016}
.opt.sel{border-color:var(--bc,#0b6b7a);background:#f2fafb;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.opt input{position:absolute;opacity:0}
.tag{font-size:11px;font-weight:700;color:#fff;background:var(--bc,#0b6b7a);border-radius:99px;padding:2px 8px}
.paper .chk{color:#0b1016}.paper .chk input{accent-color:var(--bc,#0b6b7a)}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.g{font-size:21px;font-weight:800;border-top:1px solid #dbe2e8;padding-top:10px;margin-top:6px}
.firma{font-family:"Brush Script MT","Segoe Script",cursive;font-size:26px;color:#0b3a66}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{flex:none;width:min(260px,70vw);height:170px;object-fit:cover;border-radius:12px;scroll-snap-align:start}
.quote{border-left:3px solid var(--bc,#0b6b7a);padding:6px 12px;margin:8px 0;background:#f6f9fa;border-radius:0 10px 10px 0}
details{border-bottom:1px solid #e3e8ec;padding:10px 0}summary{cursor:pointer;font-weight:600;min-height:28px}
.count{display:inline-block;padding:4px 10px;border-radius:99px;background:#fff4e0;color:#8a4b00;font-size:13px;font-weight:700}
@media(max-width:600px){.hero,.g2{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:minmax(0,1fr) minmax(0,.7fr) minmax(0,.7fr)}.g4 .d{grid-column:1/-1;order:-1}.g4 .n{grid-column:1/-1;order:-2}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.cele,.cele div{animation:none}}
@media print{body{background:#fff}.wrap,nav,.toast,.noprint{display:none!important}.ov{position:static;background:none;padding:0;backdrop-filter:none}.paper{border-radius:0}}
</style>

const B=()=>S.biz;
const waNum=n=>{const d=digits(n);return d.length<=8?digits(B().cc)+d:d};
const wa=(num,text)=>'https://wa.me/'+waNum(num)+'?text='+encodeURIComponent(text);
const opts=q=>q.opts.filter(o=>o.n&&o.p>0);
function calc(q,o,m){const op=q.opts[o]||{p:0,c:0};let sub=op.p,cost=+op.c||0,ex=0;q.extras.forEach((x,i)=>{if(m&(1<<i)){sub+=x.p;ex+=x.p;cost+=+x.c||0}});
 const disc=sub*(q.disc||0)/100,base=sub-disc,tax=q.itbms?base*ITBMS:0,tot=base+tax;return{sub,disc,base,tax,tot,dep:tot*q.dep/100,cost,ex,margin:base?(base-cost)/base:0}}
function status(q){if(['enviada','negociacion'].includes(q.status)&&q.sent&&now()>q.sent+q.valid*DAY)return'vencida';return q.status}
const accTot=q=>q.chosen?calc(q,q.chosen.o,q.chosen.m).tot:0;
const inPlay=q=>{const os=q.opts.map((o,i)=>i).filter(i=>q.opts[i].n&&q.opts[i].p>0);return os.length?Math.max(...os.map(i=>calc(q,i,0).tot)):0};
const recIdx=q=>{const i=1;return q.opts[i]&&q.opts[i].p>0?i:q.opts.findIndex(o=>o.p>0)};
function dueTouch(q){const s=status(q);if(!['enviada','negociacion'].includes(s)||q.touches>=3)return null;return q.sent+TOQUES[q.touches]*DAY<=now()?q.touches+1:null}
const code=(q,o,m)=>`COT-${String(q.num).padStart(4,'0')}-${o}${m.toString(16).toUpperCase()}-${hash(q.id+'|'+q.ver+'|'+o+'|'+m)}`;
const expOf=q=>(q.sent||now())+q.valid*DAY;
function link(q){const b=B(),data={b:b.name,w:waNum(b.wa),s:b.sign,k:b.color,g:b.guar,y:b.yappy,pp:b.paypal,bk:b.bank,id:q.id,n:q.num,ver:q.ver,c:q.client,t:q.title,si:q.situ,o:q.opts.map(({n,d,p})=>({n,d,p})),x:q.extras.map(({n,p})=>({n,p})),f:q.faq,i:q.itbms,dp:q.dep,ds:q.disc,v:expOf(q),vi:q.video};
 return'https://neurocotizaciones.pages.dev/#v='+btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fill(t,q){const c=calc(q,recIdx(q),0),b=q.opts.find(o=>o.p>0);
 return t.replace(/\{c\}/g,q.client.split(' ')[0]).replace(/\{n\}/g,q.num).replace(/\{b\}/g,b?b.n:'').replace(/\{pb\}/g,b?usd(b.p):'').replace(/\{dep\}/g,usd(c.dep)).replace(/\{v\}/g,fdate(expOf(q))).replace(/\{incl\}/g,(q.opts[recIdx(q)]||{}).d||'todo lo descrito')}
function touchMsg(q,n){const c=q.client.split(' ')[0],r=q.opts[recIdx(q)];
 if(n===1)return`Hola ${c}, ¿pudiste revisar la cotización #${q.num} (${q.title})? Si quieres te explico las opciones en 2 minutos.`;
 if(n===2)return`Hola ${c}, sobre la cotización #${q.num}: la opción ${r.n} es la que más eligen nuestros clientes (${usd(r.p)}). ¿Te ayudo con alguna duda o ajustamos algo?`;
 return`Hola ${c}, la cotización #${q.num} vence el ${fdate(expOf(q))}. ¿La dejamos reservada o la archivo por ahora? Cualquier respuesta me sirve.`}
function payText(){const b=B(),L=[];if(b.yappy)L.push('Yappy: '+b.yappy);if(b.paypal)L.push('PayPal: '+b.paypal);if(b.bank)L.push('Transferencia: '+b.bank);return L.join('\n')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
async function copy(t,ok){try{await navigator.clipboard.writeText(t);toast(ok||'Copiado')}catch(e){toast('No se pudo copiar en este visor')}}
function openUrl(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function compress(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function kpis(){const qs=S.quotes.map(q=>({q,s:status(q)})),m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
 const acc=qs.filter(x=>x.s==='aceptada'),closed=qs.filter(x=>['aceptada','rechazada','vencida'].includes(x.s));
 const resc=acc.filter(x=>x.q.touches>=2),days=acc.map(x=>(x.q.acceptedAt-x.q.sent)/DAY).sort((a,b)=>a-b);
 const resp=qs.filter(x=>x.q.sent&&x.q.reqAt).map(x=>(x.q.sent-x.q.reqAt)/36e5).sort((a,b)=>a-b);
 const med=a=>a.length?(a[Math.floor((a.length-1)/2)]+a[Math.ceil((a.length-1)/2)])/2:0;
 const cnt=[0,0,0];acc.forEach(x=>cnt[x.q.chosen.o]++);
 const exAmt=acc.reduce((a,x)=>a+calc(x.q,x.q.chosen.o,x.q.chosen.m).ex,0);
 return{rate:closed.length?acc.length/closed.length:0,closed:closed.length,acc:acc.length,
  play:qs.filter(x=>['enviada','negociacion'].includes(x.s)).reduce((a,x)=>a+inPlay(x.q),0),
  won:acc.filter(x=>x.q.acceptedAt>=+m0).reduce((a,x)=>a+accTot(x.q),0),wonAll:acc.reduce((a,x)=>a+accTot(x.q),0),
  ticket:acc.length?acc.reduce((a,x)=>a+accTot(x.q),0)/acc.length:0,ext:acc.length?acc.filter(x=>x.q.chosen.m>0).length/acc.length:0,
  resc:resc.length,rescAmt:resc.reduce((a,x)=>a+accTot(x.q),0),exAmt,med:med(days),resp:med(resp),cnt,
  sent:qs.filter(x=>x.q.sent).length,neg:qs.filter(x=>x.q.sent&&(x.s==='negociacion'||x.s==='aceptada'||x.q.touches>0)).length,due:S.quotes.filter(dueTouch).length}}

function vHoy(k){if(S.today.d!==dkey(now()))S.today={d:dkey(now()),done:0};const due=S.quotes.filter(dueTouch),done=S.today.done,p=done+due.length?done/(done+due.length):1;

function qCard(q){const s=status(q),os=opts(q);
 const amt=s==='aceptada'?usd(accTot(q)):os.length?`${usd(Math.min(...os.map(o=>o.p)))} a ${usd(Math.max(...os.map(o=>o.p)))}`:'';

  <button class="sm ghost" data-dup="${q.id}">Duplicar</button>

 document.body.appendChild(el);el.onclick=e=>{if(e.target===el||e.target.closest('button'))el.remove()};
 if(!reduce){const b=el.querySelector('.big'),t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/900);b.textContent=usd(v*(1-(1-p)**3));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}}
function registerCode(q,val){const r=/^COT-(\d{4})-(\d)([0-9A-F]+)-([0-9A-F]{4})$/i.exec(val.trim());

.nx-box h2{margin:0 0 6px;font-size:21px;padding-right:38px}.nx-box h3{margin:16px 0 6px;font-size:16px}.nx-box p{margin:6px 0}
.nx-x{all:unset;cursor:pointer;position:absolute;top:12px;right:14px;font-size:22px;line-height:1;padding:6px 10px;border-radius:10px;color:#8ea3b3}.nx-x:hover{background:rgba(255,255,255,.06);color:#fff}
.nx-mut{color:#8ea3b3;font-size:13.5px}
.nx-steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.nx-steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid rgba(255,255,255,.06)}
.nx-steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,229,255,.14);color:#00e5ff;font-weight:800;display:grid;place-items:center;font-size:14px}
.nx-ok{background:rgba(61,220,132,.10);border:1px solid rgba(61,220,132,.3);border-radius:12px;padding:10px 12px;margin:10px 0}
.nx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.nx-card{border:1px solid rgba(0,229,255,.16);border-radius:14px;padding:12px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:8px}
.nx-card img{width:48px;height:48px;border-radius:50%}
.nx-card b{font-size:15px}.nx-card .nx-mut{flex:1}
.nx-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nx-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:11px;border:1px solid rgba(0,229,255,.35);color:#eaf6fa;font-weight:700;font-size:14px;min-height:40px;text-align:center}
.nx-btn:hover,.nx-btn:focus-visible{background:rgba(0,229,255,.12)}
.nx-pri{background:#00e5ff;color:#00161a;border-color:#00e5ff}.nx-pri:hover{background:#5cf0ff}
.nx-wa{background:#25d366;color:#04210f;border-color:#25d366}
.nx-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(0,229,255,.12);color:#7fefff}
.nx-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1b24;border:1px solid rgba(0,229,255,.3);color:#eaf6fa;padding:10px 16px;border-radius:12px;z-index:2147483001;font:600 14px Inter,system-ui,sans-serif}
@media print{.nx-bar,.nx-ov{display:none!important}}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

function toast(t){const e=document.createElement('div');e.className='nx-toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function close(){const o=document.querySelector('.nx-ov:not(.nx-lock)');if(o)o.remove();document.removeEventListener('keydown',onKey)}
function onKey(e){if(e.key==='Escape')close()}
function modal(html){close();const o=document.createElement('div');o.className='nx-ov';o.innerHTML=`<div class="nx-box" role="dialog" aria-modal="true"><button class="nx-x" aria-label="Cerrar" data-nx="close">×</button>${html}</div>`;
 o.addEventListener('click',e=>{if(e.target===o)close()});document.body.appendChild(o);document.addEventListener('keydown',onKey);const b=o.querySelector('.nx-x');b&&b.focus()}

function flujo(){
 const steps=(C.flow||[]).map(s=>`<li>${s}</li>`).join('');
 modal(`<h2>Cómo llegan tus clientes a ${esc(me.n)}</h2>
 <p class="nx-mut">${esc(me.n)} es una herramienta para tu negocio: la usas tú (por ejemplo, Panadería Aurora) con tus propios clientes. Tus clientes no instalan nada.</p>
 <ol class="nx-steps">${steps}</ol>
 <div class="nx-ok"><b>Sin límite de clientes</b> en los planes de pago. La versión gratis es para probar.</div>
 <h3>¿WhatsApp llena la app solo?</h3>
 <p>No del todo, y es a propósito: no usamos la API pagada de WhatsApp, así la app cuesta un solo pago y no una mensualidad. Los mensajes que genera la app llegan ordenados y con enlaces: tú tocas el enlace o pegas el mensaje una vez, y la app hace el resto.</p>
 <h3>Tus datos</h3><p>Se guardan solo en este dispositivo. Haz un respaldo de vez en cuando: se descarga como archivo y lo puedes guardar en Drive o enviártelo por WhatsApp.</p>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="bk">Descargar respaldo</button><button class="nx-btn" data-nx="rs">Restaurar desde archivo</button></div>`);
}
function apps(){
 const list=APPS.filter(a=>a.id!==me.id);
 modal(`<h2>Más apps de Neuroactiva Labs</h2>
 <p class="nx-mut">Cada app se compra por separado, en un solo pago. Ninguna desbloquea a otra ni a SixSaaS. Descarga la versión gratis o cómprala aquí.</p>
 <div class="nx-grid">${list.map(a=>`<div class="nx-card"><img src="${L[a.id]}" alt=""><b>${esc(a.n)}</b><span class="nx-mut">${esc(a.d)}</span>${a.t.length?`<span class="nx-tag">Desde US$${a.t[0][1].toFixed(2)} · pago único</span>`:''}
 <div class="nx-row" style="margin-top:0"><a class="nx-btn" href="${esc(FREE(a.id))}" target="_blank" rel="noopener">⬇ Descargar gratis</a>${a.t.length?`<button class="nx-btn nx-pri" data-nx="buy" data-id="${a.id}">Comprar</button>`:`<a class="nx-btn nx-pri" href="${esc(wa('Hola Neuroactiva Labs 👋 Quiero información de SixSaaS Full.'))}" target="_blank" rel="noopener">Consultar</a>`}</div></div>`).join('')}</div>`);
}
function buy(id){
 const a=APPS.find(x=>x.id===id);if(!a)return;
 const msg=`Hola Neuroactiva Labs 👋 Quiero ${a.n} (pago único).\nPlan: \nYa pagué por: (PayPal / Yappy)\nTe envío el comprobante 👇`;
 modal(`<h2>Comprar ${esc(a.n)}</h2><p class="nx-mut">Pago único, sin suscripción. Clientes ilimitados en todos los planes de pago.</p>
 <h3>1. Paga por PayPal o Yappy</h3>
 <div class="nx-row">${a.t.map(([n,p])=>`<a class="nx-btn nx-pri" href="${esc(NXPAY.PAYPAL+'/'+p.toFixed(2)+'USD')}" target="_blank" rel="noopener">${esc(n)} · US$${p.toFixed(2)} con PayPal</a>`).join('')}</div>
 <p style="margin-top:12px"><b>Yappy:</b> ${esc(NXPAY.YAPPY)} a nombre de ${esc(NXPAY.YAPPY_NOMBRE)}</p>
 <div class="nx-row">${NXPAY.YAPPY_URL?`<a class="nx-btn" href="${esc(NXPAY.YAPPY_URL)}" target="_blank" rel="noopener">Pagar con Yappy</a>`:`<button class="nx-btn" data-nx="yappy">Copiar número de Yappy</button>`}</div>
 <h3>2. Envía tu comprobante por WhatsApp</h3><p>Manda la captura del pago y te respondemos con tu <b>código de activación</b>: lo pegas en <b>Activar</b> y la app queda activada para siempre en ese dispositivo.</p>
 <div class="nx-row"><a class="nx-btn nx-wa" href="${esc(wa(msg))}" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a><button class="nx-btn" data-nx="apps">← Ver otras apps</button></div>`);
}
/* ---- Respaldo en archivo ---- */
function backup(){
 let framed=false;try{framed=window.top!==window}catch(e){framed=true}
 if(framed){modal(`<h2>Respaldo</h2><p>En esta vista previa el navegador no permite descargar archivos. En la app instalada (o abierta desde su enlace propio) este botón descarga tu respaldo como archivo, sin copiar códigos.</p><p class="nx-mut">Mientras tanto, tus datos siguen guardados en este dispositivo.</p>`);return}
 const data={};(C.keys||[]).forEach(k=>{const v=localStorage.getItem(k);if(v!=null)data[k]=v});
 const txt=JSON.stringify({neuro:me.id,v:1,fecha:new Date().toISOString(),data});
 const name=`respaldo-${me.id}-${new Date().toISOString().slice(0,10)}.json`;
 const blob=new Blob([txt],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
 toast('Respaldo descargado: '+name);
}
function restore(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{const o=JSON.parse(await f.text());
  if(o&&o.data&&typeof o.data==='object'){if(o.neuro&&o.neuro!==me.id)return toast('Ese respaldo es de otra app');Object.entries(o.data).forEach(([k,v])=>{if((C.keys||[]).includes(k))localStorage.setItem(k,v)})}
  else if(C.keys&&C.keys[0]){localStorage.setItem(C.keys[0],JSON.stringify(o))}
  toast('Respaldo restaurado');setTimeout(()=>location.reload(),700)}catch(e){toast('Ese archivo no es un respaldo válido')}};
 i.click();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='close')close();else if(k==='flujo'){e.preventDefault();flujo()}else if(k==='apps'){e.preventDefault();apps()}else if(k==='buy')buy(b.dataset.id);
 else if(k==='flyer'){e.preventDefault();b.dataset.id?buy(b.dataset.id):apps()}
 else if(k==='bk')backup();else if(k==='rs')restore();
 else if(k==='yappy'){const n=NXPAY.YAPPY.replace(/\D/g,'');(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast('Número de Yappy copiado: abre Yappy y pégalo'),()=>toast('Yappy: '+NXPAY.YAPPY))}
},true);
/* ---- Versión gratis: prueba por días de uso, compra y activación por enlace ---- */
const FREE_DAYS=7;
const PUBJWK={key_ops:['verify'],ext:true,kty:'EC',x:'L58SCsJZhUeCDLz1ZhYOe79DoHNDObKSF4KftJ38Mbw',y:'jZYVUqlgVp59nI0Pnm46tO0Jkffe7qLsYO1bq6JRVKg',crv:'P-256'};
const LK='nx-lic:'+me.id, UK='nx-uso:'+me.id;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const b64u=s=>{const b=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b.padEnd(Math.ceil(b.length/4)*4,'='));return Uint8Array.from(bin,c=>c.charCodeAt(0))};
async function verify(raw){try{const key=String(raw||'').trim().replace(/\s+/g,'');const [v,p,s]=key.split('.');if(v!=='SXS1'||!p||!s)return null;
 const pub=await crypto.subtle.importKey('jwk',PUBJWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pub,b64u(s),new TextEncoder().encode(v+'.'+p)))return null;
 const d=JSON.parse(new TextDecoder().decode(b64u(p)));if(d.m!==me.id)return null;if(d.e&&new Date(d.e+'T23:59:59')<new Date())return null;return {key,d}}catch(e){return null}}
const usedDays=()=>{try{return JSON.parse(ls.get(UK)||'[]')}catch(e){return []}};
function markUse(){const d=new Date().toISOString().slice(0,10),u=usedDays();if(!u.includes(d)){u.push(d);ls.set(UK,JSON.stringify(u))}return u.length}
let licensed=false;
async function activar(raw,silent){const r=await verify(raw);if(!r){if(!silent)toast('Ese código no es válido para '+me.n+'. Revisa que esté completo o escríbenos por WhatsApp.');return false}
 ls.set(LK,r.key);licensed=true;close();unlockUI();toast('¡Listo! '+me.n+' activada para siempre en este dispositivo.');return true}
function unlockUI(){const l=document.querySelector('.nx-lock');if(l)l.remove();const c=document.querySelector('.nx-chip');if(c){c.textContent='✓ Activada';c.dataset.nx='';}}
function activarUI(){modal(`<h2>Activar ${esc(me.n)}</h2><p>Cuando confirmamos tu pago te enviamos tu <b>código de activación</b> por WhatsApp. Pégalo aquí: puedes pegar el código solo o el mensaje completo.</p>
 <label for="nxAct" style="display:block;font-weight:600;margin-top:8px">Código de activación</label><textarea id="nxAct" placeholder="Pega aquí tu código" style="width:100%;box-sizing:border-box;min-height:80px;background:#05070a;color:#eaf4f8;border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:10px;font:16px Inter,system-ui"></textarea>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="actgo">Activar</button></div>
 <p class="nx-mut" style="margin-top:14px">¿Aún no pagas o no te llegó el código?</p>
 <div class="nx-row"><button class="nx-btn" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><a class="nx-btn nx-wa" href="${esc(wa('Hola Neuroactiva Labs 👋 Ya pagué '+me.n+' y necesito mi código de activación.'))}" target="_blank" rel="noopener">Pedir mi código</a></div>`);setTimeout(()=>{const a=document.getElementById('nxAct');a&&a.focus()},50)}
function lockScreen(){if(document.querySelector('.nx-lock'))return;const o=document.createElement('div');o.className='nx-ov nx-lock';
 o.innerHTML=`<div class="nx-box" role="dialog" aria-modal="true" style="text-align:center"><img src="${L[me.id]}" alt="" style="width:84px;height:84px;border-radius:50%"><h2 style="padding:0;margin-top:8px">Terminó tu prueba gratis de ${esc(me.n)}</h2><p>Usaste tus ${FREE_DAYS} días de uso gratis. Tus datos siguen guardados en este dispositivo: activa la app para seguir usándola, sin límite de clientes y con un solo pago.</p>
 <div class="nx-row" style="justify-content:center"><button class="nx-btn nx-pri" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><button class="nx-btn" data-nx="act">Ya pagué: activar</button><button class="nx-btn" data-nx="bk">Descargar respaldo</button></div></div>`;
 document.body.appendChild(o)}
async function freeInit(){
 const m=(location.hash||'').match(/activar=(SXS1\.[\w.-]+)/)||(location.search||'').match(/activar=(SXS1\.[\w.-]+)/);
 if(m){await activar(m[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}
 if(!licensed){const k=ls.get(LK);if(k&&await verify(k))licensed=true}
 const chip=document.querySelector('.nx-chip');
 if(licensed){unlockUI();return}
 const n=markUse(),left=Math.max(0,FREE_DAYS-n+1);
 if(chip)chip.textContent=left>0?`Gratis: ${left} de ${FREE_DAYS} días de uso`:'Prueba terminada';
 if(n>FREE_DAYS)lockScreen();
}
/* Instalar como app */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.querySelector('[data-nx=inst]');if(b)b.hidden=false});
function instalar(){if(deferred){deferred.prompt();deferred=null;return}
 modal(`<h2>Instalar ${esc(me.n)}</h2><p><b>Android (Chrome):</b> menú ⋮ → <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</p><p><b>iPhone (Safari):</b> botón Compartir → <b>Agregar a inicio</b>.</p><p><b>Computadora (Chrome o Edge):</b> ícono de instalar en la barra de direcciones.</p><p class="nx-mut">Queda como una app más y funciona sin conexión.</p>`)}
if(C.free&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='act')activarUI();else if(k==='actgo'){const v=(document.getElementById('nxAct')||{}).value||'';const mm=v.replace(/\s+/g,'').match(/SXS1\.[\w-]+\.[\w-]{86}/)||v.match(/SXS1\.[\w-]+\.[\w-]+/);mm?activar(mm[0]):toast('No encontré un código de activación en ese texto')}
 else if(k==='inst')instalar();
},true);

const bar=document.createElement('div');bar.className='nx-bar';bar.innerHTML=(C.free?`<button class="nx-chip" data-nx="act">Versión gratis</button><button data-nx="inst">⬇ Instalar</button>`:'')+`<button data-nx="flujo">¿Cómo llegan mis clientes?</button><button data-nx="bk">Respaldo</button><button data-nx="apps">✦ Más apps</button>`;
document.body.insertBefore(bar,document.body.firstChild);
if(C.free)freeInit();
window.NX={flujo,apps,buy,backup,restore};
})();
</script>
