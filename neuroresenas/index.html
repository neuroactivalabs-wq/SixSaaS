.medal.won .ic{background:radial-gradient(circle at 30% 30%,#fff3c4,var(--gold));color:#2b1d00;box-shadow:0 0 24px rgba(233,196,106,.45)}
.medal.won{border-color:rgba(233,196,106,.45)}
.medal small{display:block;color:var(--mute);font-size:12px}
.prog{height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.25);font-size:14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;min-height:auto}
.day b{display:block;font-size:12px;color:var(--mute)}
.day.done{border-color:rgba(61,220,132,.5);background:rgba(61,220,132,.08)}
.day input{width:20px;min-height:20px;margin-top:2px;flex:none}
.cardprev{max-width:100%;border-radius:14px;display:block;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.plan{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel)}
.plan.best{border:2px solid var(--acc);box-shadow:0 0 40px color-mix(in srgb,var(--acc) 18%,transparent)}
.plan ul{padding-left:18px;margin:10px 0}
.price{font-size:38px;font-weight:800;white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:18px;background:#0c141c;color:var(--ink);max-width:min(640px,94vw);padding:22px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.kiosk{position:fixed;inset:0;z-index:20;background:radial-gradient(800px 500px at 50% 0%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%),#05070a;display:none;overflow:auto;padding:max(5vw,18px)}
.kiosk.open{display:block}
.kiosk .in{max-width:560px;margin:0 auto;text-align:center}
.kiosk img.lg{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 40px color-mix(in srgb,var(--acc) 35%,transparent)}
.bigstars{display:flex;justify-content:center;gap:6px;margin:18px 0}
.bigstars button{font-size:44px;min-width:60px;min-height:64px;background:none;border:0;color:rgba(255,255,255,.2);padding:0}
.bigstars button.on{color:var(--star);text-shadow:0 0 18px rgba(255,197,61,.6)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#eaf4f8;color:#05070a;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
footer{color:var(--mute);font-size:13px;text-align:center;padding:20px 0 40px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,nav,footer,.noprint{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border-color:#ccc;background:#fff}}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:13px}.stack td:empty{display:none}}

/* ---------- Confeti al ganar logros ---------- */
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=document.getElementById('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=[getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#00e5ff','#ffc53d','#ffffff','#e9c46a'];
 const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,r:Math.random()*5+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
 let f=0;(function step(){x.clearRect(0,0,c.width,c.height);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}if(++f<120)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- Métricas ---------- */
function metrics(){
 const R=S.reviews,N=R.length;
 const avg=N?R.reduce((s,r)=>s+r.stars,0)/N:0;
 const last90=R.filter(r=>ago(r.date)<=90).length;
 let weeks=0,streak=0,broken=false;for(let w=0;w<8;w++){const has=R.some(r=>{const a=ago(r.date);return a>=w*7&&a<w*7+7});if(has)weeks++;if(!broken&&has)streak++;else broken=true}
 const resp=R.filter(r=>r.responded),rate=N?resp.length/N:0;
 const times=resp.filter(r=>r.respDate).map(r=>Math.max(0,(new Date(r.respDate)-new Date(r.date))/DAY)).sort((a,b)=>a-b);
 const med=times.length?times[Math.floor(times.length/2)]:null;
 const rich=N?R.filter(r=>r.photo||(r.text||'').length>=60).length/N:0;
 const last=N?Math.min(...R.map(r=>ago(r.date))):null;
 const comp=[['Calificación promedio',30,avg<3.5?0:Math.min(1,(avg-3.5)/1),avg?fmt(avg,2)+' ★':'—','meta 4.5'],['Cantidad de reseñas',20,Math.min(1,N/50),N,N<20?'hito 20':'hito 50'],['Recencia (90 días)',15,Math.min(1,last90/6),last90,'meta 6'],['Ritmo constante',10,Math.min(1,weeks/6),weeks+' de 8 sem.','meta 6 de 8'],['Tasa de respuesta',15,rate,Math.round(rate*100)+'%','meta 100%'],['Tiempo de respuesta',5,med==null?0:med<=2?1:med>=7?0:(7-med)/5,med==null?'—':fmt(med,0)+' días','meta ≤2 días'],['Detalle y fotos',5,Math.min(1,rich/.4),Math.round(rich*100)+'%','meta 40%']];
 const score=Math.round(comp.reduce((s,c)=>s+c[1]*c[2],0));
 const reqs30=S.requests.filter(q=>ago(q.date)<=30).length,revs30=R.filter(r=>ago(r.date)<=30).length;
 return{N,avg,last90,weeks,streak,rate,med,rich,last,comp,score,pending:N-resp.length,reqs30,revs30,conv:reqs30?revs30/reqs30:0};
}

/* ---------- Mostrar: tarjetas y muro ---------- */
const CARD_THEMES={noche:['#05070a','#0e1b26','#ffffff'],marca:['acc','#05070a','#ffffff'],claro:['#ffffff','#eef3f6','#0b1520'],oro:['#1a1405','#3a2c0a','#fff6dc']};
V.mostrar=()=>{
 const ok=S.reviews.filter(r=>r.consent&&r.text).sort((a,b)=>b.stars-a.stars||b.date.localeCompare(a.date));
 const sel=V.mostrar.id&&ok.find(r=>r.id===V.mostrar.id)?V.mostrar.id:ok[0]?.id;V.mostrar.id=sel;
 const th=V.mostrar.t||'noche',fmtc=V.mostrar.f||'post';
 return `<div class="grid2" style="align-items:start">
 <div class="card glow"><div class="hd"><h2>Generador de tarjetas para redes</h2>${tier(2)}</div>
  ${ok.length?`<label for="mR">Reseña (solo las que tienen permiso)</label><select id="mR">${ok.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${'★'.repeat(r.stars)} ${esc(r.name)}: ${esc(r.text.slice(0,50))}</option>`).join('')}</select>
  <label>Estilo</label><div class="row">${Object.keys(CARD_THEMES).map(k=>`<button class="fx ${k==th?'on':''}" data-ct="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
  <label>Formato</label><div class="row"><button class="fx ${fmtc=='post'?'on':''}" data-cf="post">Post 1:1</button><button class="fx ${fmtc=='story'?'on':''}" data-cf="story">Historia 9:16</button></div>
  <div class="row" style="margin-top:12px"><button class="pri fx" id="cDl">Descargar imagen</button></div><p class="note">Si la descarga no arranca, mantén presionada la imagen para guardarla.</p>`:'<p class="muted">Marca alguna reseña con permiso para publicar.</p>'}
 </div>
 <div class="card"><canvas id="cv" class="cardprev" style="width:${fmtc=='post'?'100%':'56%'}" aria-label="Vista previa de la tarjeta"></canvas></div></div>
 <div class="card"><div class="hd"><h2>Muro de testimonios para tu web</h2>${tier(3)}</div><p class="muted">Muestra solo reseñas con permiso. Si tienes página web, toca "Copiar para mi web" y pásalo a quien maneja tu página: no tienes que leerlo ni editarlo.</p>
 <div id="wall"></div><textarea id="wallCode" hidden readonly></textarea><div class="row" style="margin-top:8px"><button class="fx" id="wallCopy">Copiar para mi web</button></div></div>`;
};
function wrapLines(x,text,maxW){const words=text.split(/\s+/);const lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(x.measureText(t).width>maxW&&l){lines.push(l);l=w}else l=t}if(l)lines.push(l);return lines}
async function drawCard(){
 const cv=document.getElementById('cv');if(!cv)return;const r=S.reviews.find(x=>x.id===V.mostrar.id);if(!r)return;
 const story=(V.mostrar.f||'post')==='story',W=1080,H=story?1920:1080;cv.width=W;cv.height=H;const x=cv.getContext('2d');
 let [c1,c2,ink]=CARD_THEMES[V.mostrar.t||'noche'];if(c1==='acc')c1=S.brand.acc;
 const g=x.createLinearGradient(0,0,W*.6,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);
 x.globalAlpha=.18;x.fillStyle=S.brand.acc;x.beginPath();x.arc(W*.9,H*.08,W*.45,0,7);x.fill();x.globalAlpha=1;
 try{await document.fonts.load('700 60px Inter')}catch(e){}
 const im=new Image();im.src=logo();try{await im.decode()}catch(e){}
 let fs0=story?66:58;x.font=`600 ${fs0}px Inter,sans-serif`;let L0=wrapLines(x,'“'+r.text+'”',W-180);while(L0.length>(story?11:7)&&fs0>34){fs0-=4;x.font=`600 ${fs0}px Inter,sans-serif`;L0=wrapLines(x,'“'+r.text+'”',W-180)}const blockH=300+L0.length*fs0*1.3+40;const top=Math.max(story?200:100,Math.round((H-120-blockH)/2)+20);x.save();x.beginPath();x.arc(150,top,60,0,7);x.clip();try{x.drawImage(im,90,top-60,120,120)}catch(e){}x.restore();
 x.fillStyle=ink;x.font='700 44px Inter,sans-serif';x.fillText(S.brand.name,236,top+6);x.globalAlpha=.7;x.font='400 30px Inter,sans-serif';x.fillText(S.brand.slogan||'',236,top+48);x.globalAlpha=1;
 x.fillStyle='#ffc53d';x.font='64px sans-serif';x.fillText('★'.repeat(r.stars),90,top+190);
 let fs=story?66:58;x.font=`600 ${fs}px Inter,sans-serif`;let lines=wrapLines(x,'“'+r.text+'”',W-180);
 while(lines.length>(story?11:7)&&fs>34){fs-=4;x.font=`600 ${fs}px Inter,sans-serif`;lines=wrapLines(x,'“'+r.text+'”',W-180)}
 x.fillStyle=ink;lines.forEach((l,i)=>x.fillText(l,90,top+300+i*fs*1.3));
 const ny=top+300+lines.length*fs*1.3+40;x.font='600 38px Inter,sans-serif';x.globalAlpha=.85;x.fillText('— '+r.name,90,ny);x.globalAlpha=1;
 x.fillStyle=S.brand.acc;x.fillRect(90,H-150,120,6);x.fillStyle=ink;x.globalAlpha=.75;x.font='400 30px Inter,sans-serif';x.fillText('Opinión de cliente en Google · '+(S.brand.addr||''),90,H-95);x.globalAlpha=1;
}
function wallHTML(){const ok=S.reviews.filter(r=>r.consent&&r.text).slice(0,6);const b=S.brand;return `<div style="font-family:Inter,system-ui,sans-serif;background:#05070a;color:#eaf4f8;padding:24px;border-radius:18px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><strong style="font-size:20px">Lo que dicen de ${esc(b.name)}</strong></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">${ok.map(r=>`<div style="background:#0f1822;border:1px solid ${b.acc}33;border-radius:14px;padding:14px"><div style="color:#ffc53d">${'★'.repeat(r.stars)}</div><p style="margin:6px 0">${esc(r.text)}</p><small style="color:#8ea3b3">${esc(r.name)}</small></div>`).join('')}</div><a href="${esc(b.link)}" style="display:inline-block;margin-top:14px;color:${b.acc}">Deja tu opinión en Google →</a></div>`}

/* ---------- Aprender ---------- */
V.aprender=()=>{
 const st=themeStats(),rows=Object.entries(st).filter(([k,v])=>v.pos+v.neg).sort((a,c)=>(c[1].pos+c[1].neg)-(a[1].pos+a[1].neg));
 const max=Math.max(1,...rows.map(([k,v])=>Math.max(v.pos,v.neg)));
 const best=[...rows].sort((a,c)=>c[1].pos-a[1].pos)[0],worst=[...rows].sort((a,c)=>c[1].neg-a[1].neg)[0];
 const wc={};for(const r of S.reviews)for(const w of (r.text||'').toLowerCase().replace(/[^\wáéíóúñü\s]/g,' ').split(/\s+/))if(w.length>3&&!STOP.has(w))wc[w]=(wc[w]||0)+1;
 const words=Object.entries(wc).sort((a,b)=>b[1]-a[1]).slice(0,24),wm=words[0]?.[1]||1;
 const TIP={'Rapidez':'Define un tiempo máximo de espera y avisa al cliente si se va a pasar.','Atención':'Repasa con el equipo el saludo y cómo manejar reclamos.','Precio':'Explica qué incluye el precio o crea una opción económica.','Ambiente':'Revisa ruido y música en horas pico.','Limpieza':'Agrega una revisión de limpieza cada 2 horas.','Estacionamiento':'Indica en tu perfil de Google dónde estacionar cerca.','Calidad':'Revisa recetas o proveedores del producto mencionado.'};
 return `<div class="card glow"><div class="hd"><h2>${best?`Lo que más elogian: ${best[0]}. Lo que más critican: ${worst&&worst[1].neg?worst[0]:'nada repetido'}.`:'Aún no hay temas detectados.'}</h2>${tier(2)}</div>
 <table class="stack"><thead><tr><th>Tema</th><th>Elogios (4–5★)</th><th>Críticas (1–3★)</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${k}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="hbar me" style="flex:0 0 ${v.pos/max*70}%"></div><b>${v.pos}</b></div></td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="hbar" style="flex:0 0 ${v.neg/max*70}%;background:var(--bad)"></div><b>${v.neg}</b></div></td></tr>`).join('')}</tbody></table>
 <p class="note" style="margin-top:8px">Detección por palabras clave en español, sin IA y sin conexión.</p></div>
 <div class="grid2" style="align-items:start">
 <div class="card"><div class="hd"><h3>Palabras que usan tus clientes</h3>${tier(3)}</div><p class="muted">Úsalas en tu descripción y publicaciones de Google.</p><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;line-height:1.6">${words.map(([w,n])=>`<span style="font-size:${14+n/wm*18}px;color:${n/wm>.5?'var(--acc)':'var(--ink)'};opacity:${.55+.45*n/wm}">${esc(w)}</span>`).join('')}</div></div>
 <div class="card"><div class="hd"><h3>Opiniones privadas del Modo cliente</h3>${tier(2)}</div>${S.feedback.map(f=>`<div class="rv"><div><span class="stars">${starsTxt(f.stars)}</span> <span class="muted">${esc(f.date)}</span><p style="margin:4px 0">${esc(f.text)||'<span class="muted">Sin comentario</span>'}</p></div><div><button data-fbdel="${f.id}" class="ghost">Resuelta</button></div></div>`).join('')||'<p class="muted">Sin opiniones privadas pendientes.</p>'}</div></div>
 <div class="card"><div class="hd"><h3>Plan de mejora y protocolo de crisis</h3>${tier(3)}</div>${rows.filter(([k,v])=>v.neg).map(([k,v])=>`<div class="alert warn"><b>${k}</b>: ${v.neg} crítica${v.neg>1?'s':''}. ${TIP[k]}</div>`).join('')||'<p class="muted">Sin críticas repetidas.</p>'}
 <h3 style="margin-top:14px">Ante una reseña de 1–2 estrellas</h3><ol><li>Responde en público en menos de 24 horas, sin discutir.</li><li>Invita a hablar en privado y deja un contacto directo.</li><li>Resuelve y anota qué cambiaste.</li><li>El cliente puede editar su reseña si quiere. Nunca ofrezcas nada a cambio.</li><li>Si es spam o de alguien que no fue cliente, repórtala en Google Maps.</li></ol></div>`;
};

 const rows=all.map(c=>{let gap='';if(!c.me){if(c.rating>=m.avg){const n=needed(m.N,m.avg,Math.min(4.99,c.rating+.01));gap=n===Infinity?'—':`<b>${n}</b> reseñas de 5★ para superarlo`}else gap='<span style="color:var(--good)">Ya lo superas</span>'}return `<tr><td>${c.me?'<b>':''}${esc(c.name)}${c.me?'</b>':''}</td><td class="n">${fmt(c.rating,1)} ★</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="hbar ${c.me?'me':''}" style="flex:0 0 ${c.count/maxC*65}%"></div><span>${c.count}</span></div></td><td>${gap}</td><td>${c.me?'':`<button class="ghost" data-dc="${c.id}" aria-label="Quitar ${esc(c.name)}">Quitar</button>`}</td></tr>`}).join('');
 return `<div class="card glow"><div class="hd"><h2>Estás en el puesto ${rank} de ${all.length} en estrellas</h2>${tier(3)}</div><p class="muted">Anota cada mes la calificación y la cantidad de reseñas que muestra Google para cada competidor (hasta 5).</p><details class="muted" style="margin:6px 0"><summary style="cursor:pointer;color:var(--acc)">¿Cómo se arma este ranking?</summary><p style="margin:6px 0">Se ordena por estrellas promedio; si hay empate, gana quien tiene más reseñas. Tus datos salen de tu libro de reseñas y los de cada competidor son los que tú anotas de Google. "Para alcanzarlo" calcula cuántas reseñas de 5★ seguidas necesitas para superar su promedio. No consulta Google en automático: así no depende de permisos ni costos de terceros.</p></details>
 <div class="scroll"><table class="stack"><thead><tr><th>Negocio</th><th class="n">Estrellas</th><th>Reseñas</th><th>Para alcanzarlo</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

 <p class="note" style="margin-top:12px">Estimación: un estudio de Harvard (Luca) encontró 5%–9% más ingresos por cada estrella en restaurantes independientes de EE. UU. En otros rubros y países el efecto puede variar.</p></div>
 <div class="card" id="report"><div class="hd"><div class="row" style="flex:1 1 auto"><img src="${logo()}" alt="" style="width:54px;height:54px;border-radius:50%;flex:0 0 auto"><div><h2 style="margin:0">Informe de reputación</h2><div class="muted">${esc(b.name)} · ${today().toLocaleDateString('es',{month:'long',year:'numeric'})}</div></div></div>${tier(3)}</div>
 <div class="kpis" style="margin-top:14px"><div class="kpi"><b>${m.score}/100</b><span>Puntaje</span></div><div class="kpi"><b>${fmt(m.avg,2)} ★</b><span>${m.N} reseñas</span></div><div class="kpi"><b>${m.revs30}</b><span>Reseñas nuevas en 30 días</span></div><div class="kpi"><b>${Math.round(m.rate*100)}%</b><span>Respondidas</span></div></div>
 <pre id="rep" style="white-space:pre-wrap;font:inherit;font-size:15px;margin:0"></pre><div class="row noprint" style="margin-top:10px"><button class="fx" id="repCopy">Copiar informe</button><button class="fx" id="repPrint">Imprimir o guardar PDF</button></div></div>`};
function reportText(){const m=metrics(),ks=Object.entries(themeStats());const b=[...ks].sort((a,c)=>c[1].pos-a[1].pos)[0],w=[...ks].sort((a,c)=>c[1].neg-a[1].neg)[0];return `Informe de reputación · ${S.brand.name} · ${iso(today())}
Puntaje de Reputación: ${m.score}/100
Promedio: ${fmt(m.avg,2)} ★ con ${m.N} reseñas

Logros: ${achievements().filter(a=>a[3]>=1).map(a=>a[1]).join(', ')||'—'}`}

/* ---------- Mi marca ---------- */
V.marca=()=>{const b=S.brand;return `<div class="grid2" style="align-items:start"><div class="card glow"><div class="hd"><h2>Mi marca</h2>${tier(1)}</div><p class="muted">Tu logo, nombre y color aparecen en la app, el kit QR, las tarjetas, el muro y el informe.</p>

 <div class="row"><div><label for="bR">Rubro</label><select id="bR">${Object.entries(RUBROS).map(([k,l])=>`<option value="${k}" ${k==b.rubro?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="bP">WhatsApp del negocio</label><input id="bP" value="${esc(b.phone)}" inputmode="tel"></div></div>
 <label for="bA">Dirección</label><input id="bA" value="${esc(b.addr)}">

V.planes=()=>{const P=[[1,'Básico','9.99',['Mi marca: logo, nombre y color','Enlace directo a Google','Simulador de meta y logros','Puntaje de Reputación','Libro de reseñas y respaldo']],[2,'Pro','14.99',['Todo lo de Básico','Kit QR con tu logo (3 piezas)','WhatsApp con plantillas por rubro','Bandeja y respuestas personalizadas','Modo cliente con opiniones privadas','Generador de tarjetas para redes','Temas que elogian y critican','Alertas de qué hacer hoy']],[3,'Premium','19.99',['Todo lo de Pro','Hasta 5 competidores y ranking','Reto de 30 días','Muro de testimonios para tu web','Palabras clave de tus clientes','Plan de mejora y protocolo de crisis','ROI e informe mensual con tu logo']]];
 return `<div class="card glow"><h2>Un pago, para siempre</h2><p class="muted">NiceJob, Birdeye o Podium cobran de US$95 a US$399 al mes por funciones parecidas. Neuro Reseñas: 7 usos gratis y luego un solo pago. Pruébala gratis con todas las funciones por 7 días de uso; las etiquetas Pro y Premium muestran a qué plan pertenece cada función.</p></div>
 <div class="grid3">${P.map(([t,n,p,f])=>`<div class="plan ${t==2?'best':''}">${t==2?'<span class="badge pro">El más elegido</span>':''}<h3 style="margin-top:8px">${n}</h3><div class="price">US$${p}</div><div class="muted">pago único</div><ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`};

/* ---------- Respuesta ---------- */
function openResp(id){
 const r=S.reviews.find(x=>x.id===id);if(!r)return;const cls=r.stars>=5?5:r.stars==4?4:r.stars==3?3:1,pool=RESP[cls];let i=0;
 const th=themesOf(r.text),det=th.length?DET[th[0]]:'';
 const prompt=`Actúa como dueño de ${S.brand.name}. Escribe una respuesta breve, cálida y profesional en español a esta reseña de ${r.stars} estrellas de ${r.name}: "${r.text}". Menciona un detalle concreto de su comentario, no uses frases genéricas, no ofrezcas regalos ni descuentos, y firma como ${S.brand.firma}. Muéstrame el texto antes de publicar nada.`;
 const d=document.getElementById('dlg');
 d.innerHTML=`<h2>Responder a ${esc(r.name)} <span class="stars">${starsTxt(r.stars)}</span></h2><p class="muted">${esc(r.text)||'Sin texto'}</p>${r.stars<=2?'<div class="alert bad">Reseña negativa: responde en menos de 24 horas, sin discutir, e invita a hablar en privado.</div>':''}
 <label for="dDet">Detalle que mencionó (para que no suene a plantilla)</label><input id="dDet" value="${esc(det)}" placeholder="por ejemplo: el pan dulce">
 <label for="dTxt">Respuesta</label><textarea id="dTxt"></textarea>
 <div class="row" style="margin-top:10px"><button class="fx" id="dAlt">Otra versión</button><button class="fx pri" id="dCp">Copiar respuesta</button><button class="fx" id="dAi">Copiar prompt para Gemini</button></div>
 <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:12px"><input id="dCons" type="checkbox" ${r.consent?'checked':''} style="width:22px;min-height:22px"> Permiso para publicarla en mis redes</label>
 <div class="row" style="margin-top:10px"><button class="fx" id="dDone">${r.responded?'Marcar sin responder':'Marcar como respondida'}</button><button class="fx ghost" id="dClose">Cerrar</button></div>`;
 const upd=()=>{d.querySelector('#dTxt').value=fill(pool[i%pool.length],{nombre:r.name.split(' ')[0],detalle:d.querySelector('#dDet').value.trim()||'tu visita',negocio:S.brand.name,firma:'— '+S.brand.firma})};upd();
 d.querySelector('#dDet').oninput=upd;d.querySelector('#dAlt').onclick=()=>{i++;upd()};
 d.querySelector('#dCp').onclick=()=>{if(!d.querySelector('#dDet').value.trim()){toast('Escribe el detalle que mencionó el cliente');return}copy(d.querySelector('#dTxt').value)};
 d.querySelector('#dAi').onclick=()=>copy(prompt);
 d.querySelector('#dCons').onchange=e=>{r.consent=e.target.checked;save()};
 d.querySelector('#dDone').onclick=()=>{r.responded=!r.responded;r.respDate=r.responded?iso(today()):'';save();d.close();render();toast(r.responded?'Marcada como respondida':'Marcada sin responder')};
 d.querySelector('#dClose').onclick=()=>{d.close();render()};
 try{d.showModal()}catch(e){d.setAttribute('open','')}
}

function kiosk(step,stars){
 const k=document.getElementById('kiosk'),b=S.brand;k.classList.add('open');
 if(step==='thanks'){k.innerHTML=`<div class="in"><img class="lg" src="${logo()}" alt=""><h1 style="font-size:32px;margin:18px 0 8px">¡Gracias!</h1><p class="muted" style="font-size:17px">Tu opinión le llega directo al equipo de ${esc(b.name)}. Si quieres, compártela también en Google para ayudar a otras personas:</p><div style="margin:18px 0">${qrBox()}</div><a class="btn pri" href="${esc(b.link)}" target="_blank" rel="noopener">Abrir Google</a><div style="margin-top:28px"><button id="kAgain">Nuevo cliente</button> <button class="ghost" id="kExit">Salir</button></div></div>`;return}
 k.innerHTML=`<div class="in"><img class="lg" src="${logo()}" alt=""><h1 style="font-size:32px;margin:18px 0 6px">¿Cómo te atendimos hoy?</h1><p class="muted" style="font-size:17px">${esc(b.name)}</p>
 <div class="bigstars" role="radiogroup" aria-label="Estrellas">${[1,2,3,4,5].map(n=>`<button data-ks="${n}" class="${stars>=n?'on':''}" aria-label="${n} estrellas">★</button>`).join('')}</div>
 <label for="kT" style="text-align:left">Cuéntanos más (opcional)</label><textarea id="kT"></textarea>
 <div class="row" style="margin-top:14px"><button class="pri" id="kSend" ${stars?'':'disabled'}>Enviar opinión</button></div>
 <p class="note" style="margin-top:16px">También puedes opinar directamente en Google: <a href="${esc(b.link)}" target="_blank" rel="noopener" style="color:var(--acc)">abrir Google</a></p>
 <button class="ghost" id="kExit" style="margin-top:20px">Salir del modo cliente</button></div>`;

/* ---------- Después de pintar ---------- */
function after(cur){
 const dl=document.getElementById('dlg');if(dl.open)dl.close();
 if(cur==='panel')drawSim();
 if(cur==='pedir')waLink();
 if(cur==='mostrar'){drawCard();const w=document.getElementById('wall');if(w){const h=wallHTML();w.innerHTML=h;document.getElementById('wallCode').value=h}}
 if(cur==='roi'){calcROI();document.getElementById('rep').textContent=reportText()}
 if(cur==='marca')document.getElementById('dJson').value=JSON.stringify(S);
}
function calcROI(){const g=id=>+document.getElementById(id).value,V2=g('iV'),R=g('iR'),T=g('iT'),d=Math.max(0,T-R),lo=V2*.05*d,hi=V2*.09*d;document.getElementById('oM').textContent=`${money(lo)}–${money(hi)}`;document.getElementById('oY').textContent=`${money(lo*12)}–${money(hi*12)} al año si subes de ${R} a ${T} estrellas`;document.getElementById('oD').textContent=hi>0?`Pro (US$14.99) se paga en ${Math.max(1,Math.round(14.99/hi*30))}–${Math.max(1,Math.round(14.99/Math.max(lo,.01)*30))} días.`:''}
function msgUpdate(){const b=S.brand,tpls=REQ[document.getElementById('wR').value]||REQ.general,n=document.getElementById('wN').value.trim();document.getElementById('wMsg').value=fill(tpls[(V.pedir.i||0)%tpls.length],{nombre:n||'{nombre}',negocio:b.name,link:b.link});waLink()}
function waLink(){const p=document.getElementById('wP').value.replace(/\D/g,'');document.getElementById('wGo').href='https://wa.me/'+p+'?text='+encodeURIComponent(document.getElementById('wMsg').value)}
function resizeLogo(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.fillStyle='#fff';x.fillRect(0,0,s,s);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/webp',.85))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,a,label.day');if(!t)return;const ds=t.dataset;
 if(ds.f){V.resenas.f=ds.f;render();return}
 if(ds.resp){openResp(ds.resp);return}
 if(ds.card){V.mostrar.id=ds.card;location.hash='mostrar';return}
 if(ds.del){S.reviews=S.reviews.filter(r=>r.id!==ds.del);save();render();toast('Reseña borrada');return}
 if(ds.dc){S.competitors=S.competitors.filter(c=>c.id!==ds.dc);save();render();return}
 if(ds.fbdel){S.feedback=S.feedback.filter(f=>f.id!==ds.fbdel);save();render();return}
 if(ds.ct){V.mostrar.t=ds.ct;render();return}
 if(ds.cf){V.mostrar.f=ds.cf;render();return}
 if(ds.acc){S.brand.acc=ds.acc;save();render();return}
 if(ds.ks){kiosk('rate',+ds.ks);return}
 switch(t.id){
  case 'openKiosk':kiosk('rate',0);break;
  case 'kExit':document.getElementById('kiosk').classList.remove('open');render();break;
  case 'kAgain':kiosk('rate',0);break;
  case 'kSend':S.feedback.unshift({id:uid(),date:iso(today()),stars:kiosk.stars,text:document.getElementById('kT').value.trim()});save();kiosk('thanks');break;
  case 'wAlt':V.pedir.i=(V.pedir.i||0)+1;msgUpdate();break;
  case 'wCopy':copy(document.getElementById('wMsg').value);break;
  case 'wGo':if(!document.getElementById('wP').value.replace(/\D/g,'')){e.preventDefault();toast('Escribe el número de WhatsApp');break}S.requests.push({id:uid(),date:iso(today()),name:document.getElementById('wN').value.trim()||'Cliente',point:document.getElementById('wPt').value});save();toast('Solicitud registrada');setTimeout(render,400);break;
  case 'qCopy':copy(S.brand.link);break;
  case 'qPrint':case 'repPrint':try{window.print()}catch(err){toast('Abre la app en su propia pestaña para imprimir')}break;
  case 'cDl':{const cv=document.getElementById('cv');cv.toBlob(bl=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='resena-'+(S.brand.name||'negocio').replace(/\W+/g,'-').toLowerCase()+'.png';document.body.appendChild(a);a.click();a.remove()}catch(err){}const d=document.getElementById('dlg');d.innerHTML=`<h3>Tu tarjeta</h3><p class="muted">Si no se descargó, mantén presionada la imagen para guardarla.</p><img src="${cv.toDataURL('image/png')}" alt="Tarjeta de reseña" style="width:100%;border-radius:12px"><div class="row" style="margin-top:10px"><button class="fx" id="dClose2">Cerrar</button></div>`;d.querySelector('#dClose2').onclick=()=>d.close();try{d.showModal()}catch(x){}},'image/png');break}
  case 'wallCopy':copy(document.getElementById('wallCode').value);break;
  case 'repCopy':copy(reportText());break;
  case 'retoReset':S.reto={start:iso(today()),done:[]};save();render();break;
  case 'bLogoReset':S.brand.logo='';save();render();toast('Logo restablecido');break;
  case 'dEmpty':S={brand:{...S.brand,name:'Mi negocio',slogan:'',logo:'',link:'https://g.page/r/TU-ENLACE/review',addr:'',phone:''},reviews:[],requests:[],feedback:[],competitors:[],reto:{start:iso(today()),done:[]},achSeen:[],sample:false};save();location.hash='marca';render();toast('Listo: completa los datos de tu negocio');break;
  case 'dSample':S=sample();save();render();toast('Datos de ejemplo cargados');break;
  case 'dExport':copy(JSON.stringify(S));break;
  case 'dImport':try{const o=JSON.parse(document.getElementById('dJson').value);if(!o.brand||!Array.isArray(o.reviews))throw 0;S=o;save();render();toast('Respaldo restaurado')}catch(err){toast('El texto no es un respaldo válido')}break;
 }
});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id==='sW'||id==='sX'){if(id==='sW'){S.brand.perWeek=+e.target.value;save()}drawSim()}
 if(['iV','iR','iT'].includes(id))calcROI();
 if(id==='wN'){V.pedir.n=e.target.value;msgUpdate()}if(id==='wP'){V.pedir.p=e.target.value;waLink()}if(id==='wMsg')waLink();
 if(id==='bAcc'){S.brand.acc=e.target.value;applyBrand()}
});
document.addEventListener('change',async e=>{const id=e.target.id;
 if(id==='wR'){V.pedir.r=e.target.value;V.pedir.i=0;msgUpdate()}
 if(id==='mR'){V.mostrar.id=e.target.value;drawCard()}
 if(id==='bAcc'){save();render()}
 if(e.target.dataset.day){const n=+e.target.dataset.day,s=new Set(S.reto.done||[]);e.target.checked?s.add(n):s.delete(n);S.reto.done=[...s];save();render()}
 if(id==='bLogo'&&e.target.files[0]){try{S.brand.logo=await resizeLogo(e.target.files[0]);S.sample=false;save();render();toast('Logo actualizado')}catch(err){toast('No se pudo leer la imagen')}}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,g=id=>document.getElementById(id);
 if(f.id==='fRev'){S.reviews.push({id:uid(),name:g('rN').value.trim(),stars:+g('rS').value,date:g('rD').value||iso(today()),text:g('rT').value.trim(),photo:g('rP').checked,consent:g('rC').checked,responded:false,respDate:''});save();render();toast('Reseña guardada')}
 if(f.id==='fComp'){S.competitors.push({id:uid(),name:g('kN').value.trim(),rating:+g('kR').value,count:+g('kC').value});save();render()}
 if(f.id==='fBrand'){Object.assign(S.brand,{name:g('bN').value.trim(),slogan:g('bS').value.trim(),rubro:g('bR').value,phone:g('bP').value.trim(),addr:g('bA').value.trim(),link:g('bL').value.trim(),firma:g('bF').value.trim(),goal:+g('bG').value,ventas:+g('bV').value});S.sample=false;save();render();toast('Marca guardada')}
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('kiosk').classList.contains('open')){document.getElementById('kiosk').classList.remove('open');render()}});
addEventListener('hashchange',render);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(document.getElementById('sFig'))drawSim()},150)});
render();
}

.nx-box h2{margin:0 0 6px;font-size:21px;padding-right:38px}.nx-box h3{margin:16px 0 6px;font-size:16px}.nx-box p{margin:6px 0}
.nx-x{all:unset;cursor:pointer;position:absolute;top:12px;right:14px;font-size:22px;line-height:1;padding:6px 10px;border-radius:10px;color:#8ea3b3}.nx-x:hover{background:rgba(255,255,255,.06);color:#fff}
.nx-mut{color:#8ea3b3;font-size:13.5px}
.nx-steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.nx-steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid rgba(255,255,255,.06)}
.nx-steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,229,255,.14);color:#00e5ff;font-weight:800;display:grid;place-items:center;font-size:14px}
.nx-ok{background:rgba(61,220,132,.10);border:1px solid rgba(61,220,132,.3);border-radius:12px;padding:10px 12px;margin:10px 0}
.nx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.nx-card{border:1px solid rgba(0,229,255,.16);border-radius:14px;padding:12px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:8px}
.nx-card img{width:48px;height:48px;border-radius:50%}
.nx-card b{font-size:15px}.nx-card .nx-mut{flex:1}
.nx-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nx-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:11px;border:1px solid rgba(0,229,255,.35);color:#eaf6fa;font-weight:700;font-size:14px;min-height:40px;text-align:center}
.nx-btn:hover,.nx-btn:focus-visible{background:rgba(0,229,255,.12)}
.nx-pri{background:#00e5ff;color:#00161a;border-color:#00e5ff}.nx-pri:hover{background:#5cf0ff}
.nx-wa{background:#25d366;color:#04210f;border-color:#25d366}
.nx-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(0,229,255,.12);color:#7fefff}
.nx-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1b24;border:1px solid rgba(0,229,255,.3);color:#eaf6fa;padding:10px 16px;border-radius:12px;z-index:2147483001;font:600 14px Inter,system-ui,sans-serif}
@media print{.nx-bar,.nx-ov{display:none!important}}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

function toast(t){const e=document.createElement('div');e.className='nx-toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function close(){const o=document.querySelector('.nx-ov:not(.nx-lock)');if(o)o.remove();document.removeEventListener('keydown',onKey)}
function onKey(e){if(e.key==='Escape')close()}
function modal(html){close();const o=document.createElement('div');o.className='nx-ov';o.innerHTML=`<div class="nx-box" role="dialog" aria-modal="true"><button class="nx-x" aria-label="Cerrar" data-nx="close">×</button>${html}</div>`;
 o.addEventListener('click',e=>{if(e.target===o)close()});document.body.appendChild(o);document.addEventListener('keydown',onKey);const b=o.querySelector('.nx-x');b&&b.focus()}

function flujo(){
 const steps=(C.flow||[]).map(s=>`<li>${s}</li>`).join('');
 modal(`<h2>Cómo llegan tus clientes a ${esc(me.n)}</h2>
 <p class="nx-mut">${esc(me.n)} es una herramienta para tu negocio: la usas tú (por ejemplo, Panadería Aurora) con tus propios clientes. Tus clientes no instalan nada.</p>
 <ol class="nx-steps">${steps}</ol>
 <div class="nx-ok"><b>Sin límite de clientes</b> en los planes de pago. La versión gratis es para probar.</div>
 <h3>¿WhatsApp llena la app solo?</h3>
 <p>No del todo, y es a propósito: no usamos la API pagada de WhatsApp, así la app cuesta un solo pago y no una mensualidad. Los mensajes que genera la app llegan ordenados y con enlaces: tú tocas el enlace o pegas el mensaje una vez, y la app hace el resto.</p>
 <h3>Tus datos</h3><p>Se guardan solo en este dispositivo. Haz un respaldo de vez en cuando: se descarga como archivo y lo puedes guardar en Drive o enviártelo por WhatsApp.</p>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="bk">Descargar respaldo</button><button class="nx-btn" data-nx="rs">Restaurar desde archivo</button></div>`);
}
function apps(){
 const list=APPS.filter(a=>a.id!==me.id);
 modal(`<h2>Más apps de Neuroactiva Labs</h2>
 <p class="nx-mut">Cada app se compra por separado, en un solo pago. Ninguna desbloquea a otra ni a SixSaaS. Descarga la versión gratis o cómprala aquí.</p>
 <div class="nx-grid">${list.map(a=>`<div class="nx-card"><img src="${L[a.id]}" alt=""><b>${esc(a.n)}</b><span class="nx-mut">${esc(a.d)}</span>${a.t.length?`<span class="nx-tag">Desde US$${a.t[0][1].toFixed(2)} · pago único</span>`:''}
 <div class="nx-row" style="margin-top:0"><a class="nx-btn" href="${esc(FREE(a.id))}" target="_blank" rel="noopener">⬇ Descargar gratis</a>${a.t.length?`<button class="nx-btn nx-pri" data-nx="buy" data-id="${a.id}">Comprar</button>`:`<a class="nx-btn nx-pri" href="${esc(wa('Hola Neuroactiva Labs 👋 Quiero información de SixSaaS Full.'))}" target="_blank" rel="noopener">Consultar</a>`}</div></div>`).join('')}</div>`);
}
function buy(id){
 const a=APPS.find(x=>x.id===id);if(!a)return;
 const msg=`Hola Neuroactiva Labs 👋 Quiero ${a.n} (pago único).\nPlan: \nYa pagué por: (PayPal / Yappy)\nTe envío el comprobante 👇`;
 modal(`<h2>Comprar ${esc(a.n)}</h2><p class="nx-mut">Pago único, sin suscripción. Clientes ilimitados en todos los planes de pago.</p>
 <h3>1. Paga por PayPal o Yappy</h3>
 <div class="nx-row">${a.t.map(([n,p])=>`<a class="nx-btn nx-pri" href="${esc(NXPAY.PAYPAL+'/'+p.toFixed(2)+'USD')}" target="_blank" rel="noopener">${esc(n)} · US$${p.toFixed(2)} con PayPal</a>`).join('')}</div>
 <p style="margin-top:12px"><b>Yappy:</b> ${esc(NXPAY.YAPPY)} a nombre de ${esc(NXPAY.YAPPY_NOMBRE)}</p>
 <div class="nx-row">${NXPAY.YAPPY_URL?`<a class="nx-btn" href="${esc(NXPAY.YAPPY_URL)}" target="_blank" rel="noopener">Pagar con Yappy</a>`:`<button class="nx-btn" data-nx="yappy">Copiar número de Yappy</button>`}</div>
 <h3>2. Envía tu comprobante por WhatsApp</h3><p>Manda la captura del pago y te respondemos con tu <b>código de activación</b>: lo pegas en <b>Activar</b> y la app queda activada para siempre en ese dispositivo.</p>
 <div class="nx-row"><a class="nx-btn nx-wa" href="${esc(wa(msg))}" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a><button class="nx-btn" data-nx="apps">← Ver otras apps</button></div>`);
}
/* ---- Respaldo en archivo ---- */
function backup(){
 let framed=false;try{framed=window.top!==window}catch(e){framed=true}
 if(framed){modal(`<h2>Respaldo</h2><p>En esta vista previa el navegador no permite descargar archivos. En la app instalada (o abierta desde su enlace propio) este botón descarga tu respaldo como archivo, sin copiar códigos.</p><p class="nx-mut">Mientras tanto, tus datos siguen guardados en este dispositivo.</p>`);return}
 const data={};(C.keys||[]).forEach(k=>{const v=localStorage.getItem(k);if(v!=null)data[k]=v});
 const txt=JSON.stringify({neuro:me.id,v:1,fecha:new Date().toISOString(),data});
 const name=`respaldo-${me.id}-${new Date().toISOString().slice(0,10)}.json`;
 const blob=new Blob([txt],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
 toast('Respaldo descargado: '+name);
}
function restore(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{const o=JSON.parse(await f.text());
  if(o&&o.data&&typeof o.data==='object'){if(o.neuro&&o.neuro!==me.id)return toast('Ese respaldo es de otra app');Object.entries(o.data).forEach(([k,v])=>{if((C.keys||[]).includes(k))localStorage.setItem(k,v)})}
  else if(C.keys&&C.keys[0]){localStorage.setItem(C.keys[0],JSON.stringify(o))}
  toast('Respaldo restaurado');setTimeout(()=>location.reload(),700)}catch(e){toast('Ese archivo no es un respaldo válido')}};
 i.click();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='close')close();else if(k==='flujo'){e.preventDefault();flujo()}else if(k==='apps'){e.preventDefault();apps()}else if(k==='buy')buy(b.dataset.id);
 else if(k==='flyer'){e.preventDefault();b.dataset.id?buy(b.dataset.id):apps()}
 else if(k==='bk')backup();else if(k==='rs')restore();
 else if(k==='yappy'){const n=NXPAY.YAPPY.replace(/\D/g,'');(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast('Número de Yappy copiado: abre Yappy y pégalo'),()=>toast('Yappy: '+NXPAY.YAPPY))}
},true);
/* ---- Versión gratis: prueba por días de uso, compra y activación por enlace ---- */
const FREE_DAYS=7;
const PUBJWK={key_ops:['verify'],ext:true,kty:'EC',x:'L58SCsJZhUeCDLz1ZhYOe79DoHNDObKSF4KftJ38Mbw',y:'jZYVUqlgVp59nI0Pnm46tO0Jkffe7qLsYO1bq6JRVKg',crv:'P-256'};
const LK='nx-lic:'+me.id, UK='nx-uso:'+me.id;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const b64u=s=>{const b=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b.padEnd(Math.ceil(b.length/4)*4,'='));return Uint8Array.from(bin,c=>c.charCodeAt(0))};
async function verify(raw){try{const key=String(raw||'').trim().replace(/\s+/g,'');const [v,p,s]=key.split('.');if(v!=='SXS1'||!p||!s)return null;
 const pub=await crypto.subtle.importKey('jwk',PUBJWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pub,b64u(s),new TextEncoder().encode(v+'.'+p)))return null;
 const d=JSON.parse(new TextDecoder().decode(b64u(p)));if(d.m!==me.id)return null;if(d.e&&new Date(d.e+'T23:59:59')<new Date())return null;return {key,d}}catch(e){return null}}
const usedDays=()=>{try{return JSON.parse(ls.get(UK)||'[]')}catch(e){return []}};
function markUse(){const d=new Date().toISOString().slice(0,10),u=usedDays();if(!u.includes(d)){u.push(d);ls.set(UK,JSON.stringify(u))}return u.length}
let licensed=false;
async function activar(raw,silent){const r=await verify(raw);if(!r){if(!silent)toast('Ese código no es válido para '+me.n+'. Revisa que esté completo o escríbenos por WhatsApp.');return false}
 ls.set(LK,r.key);licensed=true;close();unlockUI();toast('¡Listo! '+me.n+' activada para siempre en este dispositivo.');return true}
function unlockUI(){const l=document.querySelector('.nx-lock');if(l)l.remove();const c=document.querySelector('.nx-chip');if(c){c.textContent='✓ Activada';c.dataset.nx='';}}
function activarUI(){modal(`<h2>Activar ${esc(me.n)}</h2><p>Cuando confirmamos tu pago te enviamos tu <b>código de activación</b> por WhatsApp. Pégalo aquí: puedes pegar el código solo o el mensaje completo.</p>
 <label for="nxAct" style="display:block;font-weight:600;margin-top:8px">Código de activación</label><textarea id="nxAct" placeholder="Pega aquí tu código" style="width:100%;box-sizing:border-box;min-height:80px;background:#05070a;color:#eaf4f8;border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:10px;font:16px Inter,system-ui"></textarea>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="actgo">Activar</button></div>
 <p class="nx-mut" style="margin-top:14px">¿Aún no pagas o no te llegó el código?</p>
 <div class="nx-row"><button class="nx-btn" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><a class="nx-btn nx-wa" href="${esc(wa('Hola Neuroactiva Labs 👋 Ya pagué '+me.n+' y necesito mi código de activación.'))}" target="_blank" rel="noopener">Pedir mi código</a></div>`);setTimeout(()=>{const a=document.getElementById('nxAct');a&&a.focus()},50)}
function lockScreen(){if(document.querySelector('.nx-lock'))return;const o=document.createElement('div');o.className='nx-ov nx-lock';
 o.innerHTML=`<div class="nx-box" role="dialog" aria-modal="true" style="text-align:center"><img src="${L[me.id]}" alt="" style="width:84px;height:84px;border-radius:50%"><h2 style="padding:0;margin-top:8px">Terminó tu prueba gratis de ${esc(me.n)}</h2><p>Usaste tus ${FREE_DAYS} días de uso gratis. Tus datos siguen guardados en este dispositivo: activa la app para seguir usándola, sin límite de clientes y con un solo pago.</p>
 <div class="nx-row" style="justify-content:center"><button class="nx-btn nx-pri" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><button class="nx-btn" data-nx="act">Ya pagué: activar</button><button class="nx-btn" data-nx="bk">Descargar respaldo</button></div></div>`;
 document.body.appendChild(o)}
async function freeInit(){
 const m=(location.hash||'').match(/activar=(SXS1\.[\w.-]+)/)||(location.search||'').match(/activar=(SXS1\.[\w.-]+)/);
 if(m){await activar(m[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}
 if(!licensed){const k=ls.get(LK);if(k&&await verify(k))licensed=true}
 const chip=document.querySelector('.nx-chip');
 if(licensed){unlockUI();return}
 const n=markUse(),left=Math.max(0,FREE_DAYS-n+1);
 if(chip)chip.textContent=left>0?`Gratis: ${left} de ${FREE_DAYS} días de uso`:'Prueba terminada';
 if(n>FREE_DAYS)lockScreen();
}
/* Instalar como app */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.querySelector('[data-nx=inst]');if(b)b.hidden=false});
function instalar(){if(deferred){deferred.prompt();deferred=null;return}
 modal(`<h2>Instalar ${esc(me.n)}</h2><p><b>Android (Chrome):</b> menú ⋮ → <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</p><p><b>iPhone (Safari):</b> botón Compartir → <b>Agregar a inicio</b>.</p><p><b>Computadora (Chrome o Edge):</b> ícono de instalar en la barra de direcciones.</p><p class="nx-mut">Queda como una app más y funciona sin conexión.</p>`)}
if(C.free&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='act')activarUI();else if(k==='actgo'){const v=(document.getElementById('nxAct')||{}).value||'';const mm=v.replace(/\s+/g,'').match(/SXS1\.[\w-]+\.[\w-]{86}/)||v.match(/SXS1\.[\w-]+\.[\w-]+/);mm?activar(mm[0]):toast('No encontré un código de activación en ese texto')}
 else if(k==='inst')instalar();
},true);

const bar=document.createElement('div');bar.className='nx-bar';bar.innerHTML=(C.free?`<button class="nx-chip" data-nx="act">Versión gratis</button><button data-nx="inst">⬇ Instalar</button>`:'')+`<button data-nx="flujo">¿Cómo llegan mis clientes?</button><button data-nx="bk">Respaldo</button><button data-nx="apps">✦ Más apps</button>`;
document.body.insertBefore(bar,document.body.firstChild);
if(C.free)freeInit();
window.NX={flujo,apps,buy,backup,restore};
})();
</script>
