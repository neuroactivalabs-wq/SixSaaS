<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neuro Recompras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de trabajo del dueño de un negocio pequeño: directa, en dinero, con logros que motivan.
   IDEA: la caja registradora que avisa: cada pantalla empieza por el dinero que volvió o el que se va.
   PICTURE: cifra grande de ingresos recuperados, barra de segmentos y tarjeta de sellos con la marca del negocio.
   COLOUR and TYPE: noche índigo profunda con aurora suave, vidrio oscuro, acento editable (cian por defecto); Montserrat.
   LAYOUT: app móvil de una columna, barra inferior de 5 secciones, hojas deslizantes para fichas, máx. 780px. */
:root{color-scheme:dark;--acc:#00e5ff;--bg:#04050b;--ink:#eef6fb;--mut:#93a6b5;--line:rgba(255,255,255,.08);--glass:rgba(16,22,38,.62);
--ok:#35e0a1;--warn:#ffc857;--bad:#ff5d7a;--gold:#ffd166}
:root[data-theme=light]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Montserrat,system-ui,sans-serif;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 520px at 85% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 65%),
 radial-gradient(800px 600px at -10% 20%,rgba(43,20,190,.45),transparent 70%),
 radial-gradient(700px 500px at 60% 110%,rgba(120,40,200,.28),transparent 70%),
 linear-gradient(180deg,#070914,#04050b 60%)}
p,.mut{color:var(--mut)}b{color:var(--ink)}
h1{font-size:clamp(2.3rem,10vw,3.4rem);line-height:1.05;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.15rem;font-weight:800;margin-bottom:8px;text-wrap:balance}
h3{font-size:1rem;font-weight:700}
a{color:var(--acc);text-decoration:none}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;background:rgba(4,5,11,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header img{width:38px;height:38px;border-radius:12px;object-fit:cover;background:#111}
header .nm{font-weight:800;line-height:1.15}header .nm small{display:block;font-size:.72rem;font-weight:600;color:var(--mut)}
.pill{margin-left:auto;font-size:.72rem;font-weight:800;padding:5px 11px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);background:none;font-family:inherit;cursor:pointer}
.pill.pro{background:linear-gradient(90deg,#2a10d8,#7b3bff);color:#fff;border-color:#7b3bff}
main{max-width:780px;margin:0 auto;padding:16px}
section+section,.mt{margin-top:14px}
.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05)}
.hero{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 35%,transparent),transparent 70%)}
.hero h1{color:var(--acc);text-shadow:0 0 26px color-mix(in srgb,var(--acc) 50%,transparent);margin:2px 0 4px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.kpi .v{font-size:1.55rem;font-weight:800;white-space:nowrap}.kpi .l{font-size:.82rem;color:var(--mut)}.kpi .s{font-size:.76rem;color:var(--mut);margin-top:2px}
.bar{display:flex;height:20px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.84rem}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{margin-left:auto}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 16px;border-radius:99px;background:var(--acc);color:#02141a;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.08)}
.btn.g{background:rgba(255,255,255,.03);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent)}
.btn.s{min-height:38px;padding:7px 12px;font-size:.84rem}
.btn.i{background:linear-gradient(90deg,#2a10d8,#7b3bff);color:#fff}
.btn.wa{background:#25d366;color:#04210f}
.btn.d{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.w{width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--c,var(--line));color:var(--c,var(--mut));white-space:nowrap}
.item{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.item .top h3{margin-right:auto}
.item.focus{outline:2px solid var(--acc);outline-offset:6px;border-radius:12px}
.click{cursor:pointer}
.msg{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.92rem;color:#d6ecf2;white-space:pre-wrap}
input,select,textarea{font:inherit;font-size:16px;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--acc)}input[type=color]{padding:4px;height:44px}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:4px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:99px;padding:4px;overflow-x:auto}
.seg button{flex:1 0 auto;appearance:none;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;font-size:.84rem;padding:8px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;min-height:38px}
.seg button.on{background:var(--acc);color:#02141a}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:2px;background:rgba(4,5,11,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;max-width:140px;appearance:none;border:0;background:none;color:var(--mut);font:inherit;font-size:.72rem;font-weight:700;padding:7px 2px;border-radius:14px;min-height:54px;cursor:pointer;position:relative}
nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
nav .dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:.62rem;border-radius:99px;padding:0 5px;line-height:16px}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0}
.stamps i{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.15);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.72rem;color:var(--mut)}
.stamps i.on{border:2px solid var(--acc);background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent),transparent);color:#fff}
.stamps i.gift{border-color:var(--gold);background:radial-gradient(circle,rgba(255,209,102,.4),transparent)}
.cardimg{width:100%;border-radius:16px;margin-top:10px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.ach{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ach div{border:1px solid var(--line);border-radius:14px;padding:10px;font-size:.8rem;color:var(--mut);opacity:.45}
.ach div.on{opacity:1;border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:rgba(255,209,102,.07);color:var(--ink)}
.ach b{display:block;font-size:.88rem}
.big{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:800;color:var(--acc);white-space:nowrap}
.plans{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.plans .card.sel{border-color:var(--acc)}
.plans .pr{font-size:1.7rem;font-weight:800;white-space:nowrap}
.plans ul{padding-left:18px;color:var(--mut);font-size:.86rem;margin:6px 0 10px}
.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;appearance:none;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.menu:first-of-type{border-top:0}.menu small{display:block;color:var(--mut);font-size:.8rem}
.menu .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);flex:none}
.menu .ic svg{width:20px;height:20px}
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet.on{display:flex}
.sheet>div{width:100%;max-width:780px;max-height:88vh;overflow:auto;background:#0b0f1d;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.tl{font-size:.88rem;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px}
.tl .m{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--acc);color:#02141a;font-weight:800;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.note{font-size:.78rem;color:var(--mut);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}
footer{text-align:center;font-size:.74rem;color:var(--mut);margin:22px 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function calc(c){
 const cp=c.comp.slice().sort((a,b)=>a.f<b.f?-1:1),k=cp.length;
 const lastF=cp[k-1].f,since=days(lastF,today);
 let cyc=c.ciclo,learned=false;
 if(k>=2){cyc=Math.round(days(cp[0].f,lastF)/(k-1));learned=true;}
 cyc=Math.max(cyc,3);
 const tot=cp.reduce((a,x)=>a+x.m,0),tk=tot/k;
 const y12=cp.filter(x=>days(x.f,today)<=365).reduce((a,x)=>a+x.m,0);
 const r=since/cyc;
 const seg=r>4?'perdido':r>2?'dormido':r>1.4?'riesgo':k===1?'nuevo':'fiel';
 const pts=Math.floor(tot*B().pto)-(c.ptsU||0);
 return{k,cp,first:cp[0].f,lastF,since,cyc,learned,tot,tk,y12,r,seg,pts,next:addD(lastF,cyc),anual:tk*365/cyc};

 const L=S.cl.map(c=>({c,x:calc(c)}));
 const act=L.filter(o=>o.x.seg==='fiel').sort((a,b)=>b.x.y12-a.x.y12);
 act.slice(0,Math.max(1,Math.round(L.length*.12))).forEach(o=>{if(o.x.k>=3)o.x.seg='vip'});
 return S.plan==='gratis'?L.slice(0,10):L;
}
const nivel=y=>y>=B().oro?['Oro','#ffd166']:y>=B().plata?['Plata','#d7dee3']:['Bronce','#d08a55'];
const has=need=>need==='esencial'?S.plan!=='gratis':need==='pro'?S.plan==='pro':true;
function tplText(t,v){return (S.tpl[t]&&S.tpl[t][v])||TPL[t][v]}
function fill(t,c){const b=B(),R=RUBROS[b.rubro]||RUBROS.farmacia;
 return t.replace(/{nombre}/g,c.n.split(' ')[0]).replace(/{producto}/g,c.p).replace(/{negocio}/g,b.name).replace(/{gancho}/g,R.g).replace(/{consejo}/g,R.k[0].toUpperCase()+R.k.slice(1))
  .replace(/{oferta1}/g,b.of1).replace(/{oferta2}/g,b.of2).replace(/{oferta3}/g,b.of3).replace(/{regalo}/g,b.regalo);}
function nearMD(md,lo,hi){if(!md)return false;const [m,d]=md.split('-').map(Number);for(let i=lo;i<=hi;i++){const t=new Date(+today+i*DAY);if(t.getMonth()+1===m&&t.getDate()===d)return true}return false}
const RESC=['riesgo','dormido','perdido'];
function due(L){
 const out=[];
 for(const o of L){const c=o.c,x=o.x;if(!c.ok)continue;
  if(c.pos&&c.pos>TODAY)continue;
  if(c.ult&&days(c.ult,today)<3){out.push({o,t:'espera'});continue;}
  let t=null;
  if(nearMD(c.cum,0,3)&&!(c.ult&&c.ultT==='cumple'&&days(c.ult,today)<30))t='cumple';
  else if(x.k>=2&&nearMD(x.first.slice(5),0,3)&&days(x.first,today)>=360)t='aniversario';
  else if(x.since>=4&&x.since<=9&&!(c.ult&&c.ult>=x.lastF))t='posventa';
  else if(x.seg==='nuevo'&&x.since>=x.cyc-2)t='segunda';
  else if((x.seg==='fiel'||x.seg==='vip')&&x.since>=x.cyc-2)t='recompra';
  else if(RESC.includes(x.seg)&&!(c.ult&&days(c.ult,today)<14))t=x.seg;
  if(t&&(has('esencial')||!RESC.includes(t)&&t!=='cumple'&&t!=='aniversario'))out.push({o,t});
 }
 const ord={cumple:0,aniversario:1,posventa:2,segunda:3,recompra:4,riesgo:5,dormido:6,perdido:7,espera:9};
 return out.sort((a,b)=>ord[a.t]-ord[b.t]||b.o.x.anual-a.o.x.anual);
}
function stats(){
 const L=all(),m0=TODAY.slice(0,8)+'01';
 const rec=L.flatMap(o=>o.c.comp.filter(x=>x.pm&&x.f>=m0)).reduce((a,x)=>a+x.m,0);
 const recAll=L.flatMap(o=>o.c.comp.filter(x=>x.pm)).reduce((a,x)=>a+x.m,0);
 const nRec=L.flatMap(o=>o.c.comp.filter(x=>x.pm)).length;
 const sentM=Object.entries(S.log).filter(([d])=>d>=m0).reduce((a,[,n])=>a+n,0);
 const sentAll=Object.values(S.log).reduce((a,n)=>a+n,0);
 let streak=0;for(let i=0;i<400;i++){const d=addD(TODAY,-i);if((S.log[d]||0)>=B().meta)streak++;else if(i>0)break;}
 return{L,rec,recAll,nRec,sentM,sentAll,streak,refs:S.cl.filter(c=>c.ref).length,resc:S.resc||0,done:S.cl.reduce((a,c)=>a+(c.done||0),0)};
}

function boom(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('#fx'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const col=[B().color,'#ffd166','#b48cff','#35e0a1','#ffffff'];const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:4+Math.random()*5,c:col[Math.random()*5|0],r:Math.random()*6}));
 let f=0;(function tick(){x.clearRect(0,0,cv.width,cv.height);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()}
 if(++f<90)requestAnimationFrame(tick);else x.clearRect(0,0,cv.width,cv.height)})();}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200);}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function stampImage(c){
 const W=900,H=520,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');const acc=B().color;
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0d0f2a');g.addColorStop(1,'#1b0b4a');x.fillStyle=g;x.beginPath();x.roundRect(0,0,W,H,36);x.fill();
 const rg=x.createRadialGradient(W*.85,0,10,W*.85,0,420);rg.addColorStop(0,acc+'66');rg.addColorStop(1,'transparent');x.fillStyle=rg;x.fillRect(0,0,W,H);
 const lg=await loadImg(B().logo||NR_LOGO);if(lg){x.save();x.beginPath();x.roundRect(48,44,96,96,24);x.clip();x.drawImage(lg,48,44,96,96);x.restore();}
 x.fillStyle='#fff';x.font='800 40px Montserrat,sans-serif';x.fillText(B().name,168,92);x.fillStyle='#b9c6d2';x.font='600 26px Montserrat,sans-serif';x.fillText('Tarjeta de '+c.n.split(' ')[0],168,130);
 const n=(c.s||0)+2;for(let i=0;i<10;i++){const cx=110+(i%5)*170,cy=230+Math.floor(i/5)*130;x.beginPath();x.arc(cx,cy,48,0,7);
  if(i<n){x.fillStyle=i<2?'#ffd16655':acc+'55';x.fill();x.lineWidth=4;x.strokeStyle=i<2?'#ffd166':acc;x.stroke();x.fillStyle='#fff';x.font='800 22px Montserrat,sans-serif';x.textAlign='center';x.fillText(i<2?'Regalo':'✓',cx,cy+8);x.textAlign='left';}
  else{x.setLineDash([8,8]);x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.25)';x.stroke();x.setLineDash([]);x.fillStyle='rgba(255,255,255,.5)';x.font='700 22px Montserrat,sans-serif';x.textAlign='center';x.fillText(i===9?'Premio':String(i+1),cx,cy+8);x.textAlign='left';}}
 x.fillStyle='#b9c6d2';x.font='600 24px Montserrat,sans-serif';x.fillText(`Llevas ${n} de 10 · Premio: ${B().premio}`,48,H-40);
 return cv.toDataURL('image/png');
}
async function compress(file,max){const u=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});const im=await loadImg(u);if(!im)return null;
 const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
 let o=cv.toDataURL('image/webp',.82);if(!o.startsWith('data:image/webp'))o=cv.toDataURL('image/png');return o;}

function importCSV(t){let n=0;for(const line of t.split(/\r?\n/)){const p=line.split(/[,;\t]/).map(s=>s.trim());if(p.length<3||!p[0]||/^nombre$/i.test(p[0]))continue;
 const f=/^\d{4}-\d{2}-\d{2}$/.test(p[4]||'')?p[4]:TODAY;S.cl.push({id:'c'+Date.now()+n,n:p[0],tel:(p[1]||'').replace(/\D/g,''),p:p[2],ciclo:+p[3]||30,ok:true,cum:'',s:0,ptsU:0,ref:'',code:'NR'+(2000+S.cl.length),ult:null,ultT:'',v:n%2?'B':'A',pos:null,comp:[{f,m:+p[5]||0,pm:false}]});n++;}
 save();render();toast(n?`${n} cliente${n>1?'s':''} importado${n>1?'s':''}`:'No encontré líneas válidas');}

 if(t.id==='sim'){S.sim=+t.value;const vr=+t.closest('.card').querySelector('h2').textContent.replace(/[^\d]/g,'');$('#simP').textContent=t.value+'%';$('#simV').textContent=money(vr*t.value/100);save();return;}
 if(d.k){S.calc[d.k]=+t.value||0;const c=S.calc,loss=c.n*12*(c.x/100)*c.t*Math.max(0,c.f-1);$('#kLoss').textContent=money(loss);$('#kRec').textContent=money(loss*.2);save();return;}
 if(d.tpl){(S.tpl[d.tpl]=S.tpl[d.tpl]||{})[d.v]=t.value;t.nextElementSibling.textContent=fill(t.value,{n:'María González',p:(RUBROS[B().rubro]||RUBROS.farmacia).p[0][0]});save();return;}
 if(d.b&&t.type!=='color'&&t.tagName!=='SELECT'){const num=['meta','plata','oro','canje','valor'].includes(d.b);B()[d.b]=num?(+t.value||0):t.value;save();if(d.b==='name')$('#hname').textContent=t.value||'Mi negocio';return;}
 if(d.f&&t.tagName==='INPUT'){const c=byId($('#delC').dataset.id);c[d.f]=t.value;save();return;}

document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;

 if(t.id==='sc'){S.sel=t.value;save();render();}
 if(t.id==='rc'){S.selR=t.value;save();render();}
 if(d.b&&(t.type==='color'||t.tagName==='SELECT')){B()[d.b]=t.value;save();render();toast('Guardado');}
 if(d.f==='ok'){const c=byId($('#delC').dataset.id);c.ok=t.value==='1';save();render();toast(c.ok?'Autorización registrada':'No le escribiremos más');}

 if(t.id==='csvF'&&t.files[0]){importCSV(await t.files[0].text());}
});

 const v=id=>$('#'+id).value.trim();

 save();closeSheet();render();toast('Cliente guardado');});

 <h3>¿WhatsApp llena la app solo?</h3>
 <p>No del todo, y es a propósito: no usamos la API pagada de WhatsApp, así la app cuesta un solo pago y no una mensualidad. Los mensajes que genera la app llegan ordenados y con enlaces: tú tocas el enlace o pegas el mensaje una vez, y la app hace el resto.</p>
 <h3>Tus datos</h3><p>Se guardan solo en este dispositivo. Haz un respaldo de vez en cuando: se descarga como archivo y lo puedes guardar en Drive o enviártelo por WhatsApp.</p>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="bk">Descargar respaldo</button><button class="nx-btn" data-nx="rs">Restaurar desde archivo</button></div>`);
}
function apps(){
 const list=APPS.filter(a=>a.id!==me.id);
 modal(`<h2>Más apps de Neuroactiva Labs</h2>
 <p class="nx-mut">Cada app se compra por separado, en un solo pago. Ninguna desbloquea a otra ni a SixSaaS. Descarga la versión gratis o cómprala aquí.</p>
 <div class="nx-grid">${list.map(a=>`<div class="nx-card"><img src="${L[a.id]}" alt=""><b>${esc(a.n)}</b><span class="nx-mut">${esc(a.d)}</span>${a.t.length?`<span class="nx-tag">Desde US$${a.t[0][1].toFixed(2)} · pago único</span>`:''}
 <div class="nx-row" style="margin-top:0"><a class="nx-btn" href="${esc(FREE(a.id))}" target="_blank" rel="noopener">⬇ Descargar gratis</a>${a.t.length?`<button class="nx-btn nx-pri" data-nx="buy" data-id="${a.id}">Comprar</button>`:`<a class="nx-btn nx-pri" href="${esc(wa('Hola Neuroactiva Labs 👋 Quiero información de SixSaaS Full.'))}" target="_blank" rel="noopener">Consultar</a>`}</div></div>`).join('')}</div>`);
}
function buy(id){
 const a=APPS.find(x=>x.id===id);if(!a)return;
 const msg=`Hola Neuroactiva Labs 👋 Quiero ${a.n} (pago único).\nPlan: \nYa pagué por: (PayPal / Yappy)\nTe envío el comprobante 👇`;
 modal(`<h2>Comprar ${esc(a.n)}</h2><p class="nx-mut">Pago único, sin suscripción. Clientes ilimitados en todos los planes de pago.</p>
 <h3>1. Paga por PayPal o Yappy</h3>
 <div class="nx-row">${a.t.map(([n,p])=>`<a class="nx-btn nx-pri" href="${esc(NXPAY.PAYPAL+'/'+p.toFixed(2)+'USD')}" target="_blank" rel="noopener">${esc(n)} · US$${p.toFixed(2)} con PayPal</a>`).join('')}</div>
 <p style="margin-top:12px"><b>Yappy:</b> ${esc(NXPAY.YAPPY)} a nombre de ${esc(NXPAY.YAPPY_NOMBRE)}</p>
 <div class="nx-row">${NXPAY.YAPPY_URL?`<a class="nx-btn" href="${esc(NXPAY.YAPPY_URL)}" target="_blank" rel="noopener">Pagar con Yappy</a>`:`<button class="nx-btn" data-nx="yappy">Copiar número de Yappy</button>`}</div>
 <h3>2. Envía tu comprobante por WhatsApp</h3><p>Manda la captura del pago y te respondemos con un <b>enlace de activación</b>: lo abres en tu teléfono y la app queda activada. Sin copiar códigos.</p>
 <div class="nx-row"><a class="nx-btn nx-wa" href="${esc(wa(msg))}" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a><button class="nx-btn" data-nx="apps">← Ver otras apps</button></div>`);
}
/* ---- Respaldo en archivo ---- */
function backup(){
 let framed=false;try{framed=window.top!==window}catch(e){framed=true}
 if(framed){modal(`<h2>Respaldo</h2><p>En esta vista previa el navegador no permite descargar archivos. En la app instalada (o abierta desde su enlace propio) este botón descarga tu respaldo como archivo, sin copiar códigos.</p><p class="nx-mut">Mientras tanto, tus datos siguen guardados en este dispositivo.</p>`);return}
 const data={};(C.keys||[]).forEach(k=>{const v=localStorage.getItem(k);if(v!=null)data[k]=v});
 const txt=JSON.stringify({neuro:me.id,v:1,fecha:new Date().toISOString(),data});
 const name=`respaldo-${me.id}-${new Date().toISOString().slice(0,10)}.json`;
 const blob=new Blob([txt],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
 toast('Respaldo descargado: '+name);
}
function restore(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{const o=JSON.parse(await f.text());
  if(o&&o.data&&typeof o.data==='object'){if(o.neuro&&o.neuro!==me.id)return toast('Ese respaldo es de otra app');Object.entries(o.data).forEach(([k,v])=>{if((C.keys||[]).includes(k))localStorage.setItem(k,v)})}
  else if(C.keys&&C.keys[0]){localStorage.setItem(C.keys[0],JSON.stringify(o))}
  toast('Respaldo restaurado');setTimeout(()=>location.reload(),700)}catch(e){toast('Ese archivo no es un respaldo válido')}};
 i.click();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='close')close();else if(k==='flujo'){e.preventDefault();flujo()}else if(k==='apps'){e.preventDefault();apps()}else if(k==='buy')buy(b.dataset.id);
 else if(k==='flyer'){e.preventDefault();b.dataset.id?buy(b.dataset.id):apps()}
 else if(k==='bk')backup();else if(k==='rs')restore();
 else if(k==='yappy'){const n=NXPAY.YAPPY.replace(/\D/g,'');(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast('Número de Yappy copiado: abre Yappy y pégalo'),()=>toast('Yappy: '+NXPAY.YAPPY))}
},true);
/* ---- Versión gratis: prueba por días de uso, compra y activación por enlace ---- */
const FREE_DAYS=7;
const PUBJWK={key_ops:['verify'],ext:true,kty:'EC',x:'L58SCsJZhUeCDLz1ZhYOe79DoHNDObKSF4KftJ38Mbw',y:'jZYVUqlgVp59nI0Pnm46tO0Jkffe7qLsYO1bq6JRVKg',crv:'P-256'};
const LK='nx-lic:'+me.id, UK='nx-uso:'+me.id;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const b64u=s=>{const b=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b.padEnd(Math.ceil(b.length/4)*4,'='));return Uint8Array.from(bin,c=>c.charCodeAt(0))};
async function verify(raw){try{const key=String(raw||'').trim().replace(/\s+/g,'');const [v,p,s]=key.split('.');if(v!=='SXS1'||!p||!s)return null;
 const pub=await crypto.subtle.importKey('jwk',PUBJWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pub,b64u(s),new TextEncoder().encode(v+'.'+p)))return null;
 const d=JSON.parse(new TextDecoder().decode(b64u(p)));if(d.m!==me.id)return null;if(d.e&&new Date(d.e+'T23:59:59')<new Date())return null;return {key,d}}catch(e){return null}}
const usedDays=()=>{try{return JSON.parse(ls.get(UK)||'[]')}catch(e){return []}};
function markUse(){const d=new Date().toISOString().slice(0,10),u=usedDays();if(!u.includes(d)){u.push(d);ls.set(UK,JSON.stringify(u))}return u.length}
let licensed=false;
async function activar(raw,silent){const r=await verify(raw);if(!r){if(!silent)toast('Ese enlace o código no es válido para '+me.n+'. Escríbenos por WhatsApp.');return false}
 ls.set(LK,r.key);licensed=true;close();unlockUI();toast('¡Listo! '+me.n+' activada para siempre en este dispositivo.');return true}
function unlockUI(){const l=document.querySelector('.nx-lock');if(l)l.remove();const c=document.querySelector('.nx-chip');if(c){c.textContent='✓ Activada';c.dataset.nx='';}}
function activarUI(){modal(`<h2>Activar ${esc(me.n)}</h2><p>Cuando confirmamos tu pago te enviamos por WhatsApp un <b>enlace de activación</b>. Ábrelo en este teléfono o computadora y la app queda activada sola. No tienes que copiar nada.</p>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><a class="nx-btn nx-wa" href="${esc(wa('Hola Neuroactiva Labs 👋 Ya pagué '+me.n+' y necesito mi enlace de activación.'))}" target="_blank" rel="noopener">Pedir mi enlace</a></div>
 <details style="margin-top:14px"><summary class="nx-mut" style="cursor:pointer">¿El enlace no abrió la app?</summary><p class="nx-mut">Mantén presionado el mensaje que te enviamos, toca Copiar y pégalo aquí completo.</p><textarea id="nxAct" style="width:100%;min-height:70px;background:#05070a;color:#eaf4f8;border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:8px;font:14px Inter,system-ui"></textarea><div class="nx-row"><button class="nx-btn" data-nx="actgo">Activar</button></div></details>`)}
function lockScreen(){if(document.querySelector('.nx-lock'))return;const o=document.createElement('div');o.className='nx-ov nx-lock';
 o.innerHTML=`<div class="nx-box" role="dialog" aria-modal="true" style="text-align:center"><img src="${L[me.id]}" alt="" style="width:84px;height:84px;border-radius:50%"><h2 style="padding:0;margin-top:8px">Terminó tu prueba gratis de ${esc(me.n)}</h2><p>Usaste tus ${FREE_DAYS} días de uso gratis. Tus datos siguen guardados en este dispositivo: activa la app para seguir usándola, sin límite de clientes y con un solo pago.</p>
 <div class="nx-row" style="justify-content:center"><button class="nx-btn nx-pri" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><button class="nx-btn" data-nx="act">Ya pagué: activar</button><button class="nx-btn" data-nx="bk">Descargar respaldo</button></div></div>`;
 document.body.appendChild(o)}
async function freeInit(){
 const m=(location.hash||'').match(/activar=(SXS1\.[\w.-]+)/)||(location.search||'').match(/activar=(SXS1\.[\w.-]+)/);
 if(m){await activar(m[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}
 if(!licensed){const k=ls.get(LK);if(k&&await verify(k))licensed=true}
 const chip=document.querySelector('.nx-chip');
 if(licensed){unlockUI();return}
 const n=markUse(),left=Math.max(0,FREE_DAYS-n+1);
 if(chip)chip.textContent=left>0?`Gratis: ${left} de ${FREE_DAYS} días de uso`:'Prueba terminada';
 if(n>FREE_DAYS)lockScreen();
}
/* Instalar como app */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.querySelector('[data-nx=inst]');if(b)b.hidden=false});
function instalar(){if(deferred){deferred.prompt();deferred=null;return}
 modal(`<h2>Instalar ${esc(me.n)}</h2><p><b>Android (Chrome):</b> menú ⋮ → <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</p><p><b>iPhone (Safari):</b> botón Compartir → <b>Agregar a inicio</b>.</p><p><b>Computadora (Chrome o Edge):</b> ícono de instalar en la barra de direcciones.</p><p class="nx-mut">Queda como una app más y funciona sin conexión.</p>`)}
if(C.free&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='act')activarUI();else if(k==='actgo'){const v=(document.getElementById('nxAct')||{}).value||'';const mm=v.match(/SXS1\.[\w.-]+/);mm?activar(mm[0]):toast('No encontré la activación en ese texto')}
 else if(k==='inst')instalar();
},true);

const bar=document.createElement('div');bar.className='nx-bar';bar.innerHTML=(C.free?`<button class="nx-chip" data-nx="act">Versión gratis</button><button data-nx="inst">⬇ Instalar</button>`:'')+`<button data-nx="flujo">¿Cómo llegan mis clientes?</button><button data-nx="bk">Respaldo</button><button data-nx="apps">✦ Más apps</button>`;
document.body.insertBefore(bar,document.body.firstChild);
if(C.free)freeInit();
window.NX={flujo,apps,buy,backup,restore};
})();
</script>
