<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta diaria de un negocio que vende por WhatsApp; directa y segura.
   IDEA: la caja registradora premium del negocio, con su propia marca al frente.
   PICTURE: panel de Hoy con "Dinero en la calle" enorme sobre fondo negro con brillo cian del logo.
   COLOUR and TYPE: negro profundo #04060a con halo cian #00e5ff (logo), coral para deudas, oro suave para metas; Inter.
   LAYOUT: barra con logo del negocio y pestañas, una columna en móvil, rejillas en escritorio. */
:root{color-scheme:dark;
--bg:light-dark(#eef3f6,#04060a);--panel:light-dark(#ffffffee,#0b1118d9);--panel2:light-dark(#f6f9fb,#0f1720);--line:light-dark(#d5dee5,#1a2733);
--ink:light-dark(#0a1117,#eaf4f8);--mute:light-dark(#53636f,#8b9cab);
--cy:light-dark(#00808f,#00e5ff);--cyb:light-dark(#dff6f9,#00e5ff14);--cyink:light-dark(#fff,#00161a);
--debt:light-dark(#c2410c,#ff8a5c);--debtb:light-dark(#fff0e8,#ff8a5c14);
--gold:light-dark(#9a6b00,#f5c96a);--ok:light-dark(#15803d,#4ade80);
--glow:light-dark(none,0 0 0 1px #00e5ff22,0 10px 40px -12px #00e5ff40)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:120px}
body{margin:0;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
background:radial-gradient(1200px 600px at 85% -10%,light-dark(#c9f3f8,#00e5ff1f),transparent 60%),radial-gradient(900px 500px at -10% 110%,light-dark(#ffe3d6,#ff8a5c12),transparent 60%),var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:5;background:light-dark(#eef3f6e6,#04060ae6);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px) 6px;max-width:1300px;margin:0 auto}
.hlogo{width:42px;height:42px;border-radius:12px;object-fit:cover;background:#000;box-shadow:var(--glow)}
.top h1{font-size:18px;margin:0;font-weight:700;line-height:1.2}.top small{color:var(--mute);display:block;font-size:13px}
.plan{margin-left:auto;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:linear-gradient(90deg,#00e5ff,#7cf3ff);color:#00161a;white-space:nowrap;text-decoration:none}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,14px) 8px;max-width:1300px;margin:0 auto;scrollbar-width:none}
nav a{flex:none;padding:9px 13px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px}
nav a.on{background:var(--cyb);color:var(--cy);box-shadow:inset 0 0 0 1px light-dark(transparent,#00e5ff33)}
main{max-width:1300px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h2{font-size:clamp(26px,4vw,38px);line-height:1.08;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 18px;max-width:72ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.hero{display:grid;gap:14px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);margin-bottom:14px}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{background:linear-gradient(135deg,var(--debtb),transparent),var(--panel);border-color:light-dark(#ffd2bd,#ff8a5c40)}
.big .n{font-size:clamp(46px,9vw,80px);font-weight:800;line-height:1;color:var(--debt);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big p{margin:10px 0 0;color:var(--mute)}
.win{background:linear-gradient(135deg,var(--cyb),transparent),var(--panel);border-color:light-dark(#b5e9ef,#00e5ff40);box-shadow:var(--glow)}
.win .n{font-size:clamp(36px,6vw,54px);font-weight:800;color:var(--cy);line-height:1;font-variant-numeric:tabular-nums}
.k{color:var(--mute);font-size:14px;font-weight:500}.v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta{font-size:13px;font-weight:700}.up{color:var(--ok)}.dn{color:var(--debt)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),light-dark(#38bdf8,#7cf3ff))}
.bar.gold i{background:linear-gradient(90deg,#e0a83a,var(--gold))}
button,.btn{font:inherit;font-size:15px;font-weight:600;min-height:44px;padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--cy)!important;border-color:var(--cy)!important;color:var(--cyink)!important}
.wa{background:#1fa855!important;border-color:#1fa855!important;color:#fff!important}
button.sm,.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:100%;min-height:44px}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
label{font-size:14px;color:var(--mute);display:block;margin:10px 0 4px}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:15px}.chk input{width:auto;min-height:0;margin-top:4px}
.board{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(232px,1fr));overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:120px;scroll-snap-align:start}
.col h3{font-size:15px;display:flex;justify-content:space-between}
.ord{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--panel2)}
.ord b{font-variant-numeric:tabular-nums}.meta{font-size:13px;color:var(--mute)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.debt{background:var(--debtb);color:var(--debt)}.tag.ok{background:var(--cyb);color:var(--cy)}.tag.gold{background:light-dark(#fff4d6,#f5c96a1f);color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.phone{max-width:390px;margin:0 auto;border:8px solid light-dark(#0a1117,#1a2733);border-radius:32px;padding:14px;background:var(--panel2);box-shadow:var(--glow)}
.shop-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}.shop-h img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#000}
.prod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ph{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#05070a}
.qty{display:flex;align-items:center;gap:4px}.qty button{min-height:36px;width:36px;padding:0}
.tot{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}.toast button{min-height:34px;background:transparent;color:var(--bg);border-color:currentColor}
.dlg{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:8;padding:16px}.dlg.on{display:grid}
.dlg .card{width:min(580px,100%);max-height:92vh;overflow:auto;background:var(--panel2)}
.note{font-size:13px;color:var(--mute)}.empty{color:var(--mute);font-size:14px;padding:10px 0}
.scroll{overflow-x:auto}
.steps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.step{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;background:var(--panel2)}
.step i{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;border:2px solid var(--line)}
.step.done i{background:var(--cy);border-color:var(--cy);color:var(--cyink)}.step.done{color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--panel2);cursor:pointer;font:inherit;color:inherit;min-height:0;display:block}
.day.on{border-color:var(--cy);box-shadow:inset 0 0 0 1px var(--cy)}.day b{display:block;font-size:20px}.day.full b{color:var(--debt)}
.rcpt{background:#fff;color:#0a1117;border-radius:14px;padding:18px;font-size:14px;max-width:360px;margin:0 auto}
.rcpt .hd{display:flex;gap:10px;align-items:center;border-bottom:1px dashed #b8c2ca;padding-bottom:10px;margin-bottom:8px}
.rcpt img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#000}
.rcpt td{border:0;padding:3px 0}.rcpt .t td{border-top:1px dashed #b8c2ca;font-weight:800;padding-top:8px}
.flyer{width:100%;max-width:420px;border-radius:14px;display:block;margin:0 auto;box-shadow:var(--glow)}
.lock{font-size:12px;color:var(--gold);font-weight:700}
.logo-edit{display:flex;gap:12px;align-items:center}.logo-edit img{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#000;box-shadow:var(--glow)}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}.plan{display:none}}
</style>

function parseMsg(t){
  const g=r=>(t.match(r)||[])[1];
  const items=[...t.matchAll(/^\s*(\d+)\s*x\s*(.+?)\s*=\s*([\d.,]+)\s*$/gmi)].map(x=>{const cant=+x[1],sub=parseFloat(x[3].replace(',','.'));const nm=x[2].trim();const p=S.prods.find(p=>p.nombre.toLowerCase()===nm.toLowerCase());return {pid:p?p.id:null,nombre:nm,cant,precio:sub/cant,costo:p?p.costo:0}});
  if(!items.length)return null;
  const env=t.match(/Envio\s*\(([^)]*)\)\s*:\s*([\d.,]+)/i),envio=env?parseFloat(env[2].replace(',','.')):0;
  const ent=g(/Entrega:\s*(\d{4}-\d{2}-\d{2})/i);
  return {id:uid(),code:g(/Pedido\s+(NP-\d+)/i)||code(),cliente:(g(/Cliente:\s*(.+)/i)||'Cliente').trim(),tel:(g(/Tel:\s*(.+)/i)||'').trim(),dir:(g(/Direccion:\s*(.+)/i)||'').trim(),items,envio,zona:env?env[1]:'Centro',

}

function drawFlyer(){

  const th={Noche:['#04060a','#0b1a24','#00e5ff','#eaf4f8','#8b9cab'],Claro:['#ffffff','#e6f7fa','#00808f','#0a1117','#53636f'],Coral:['#2a0f08','#4a1a0d','#ff8a5c','#fff3ee','#f2b9a3']}[st];

function cierre(){
  const now=Date.now(),hoy=S.orders.filter(o=>o.estado==='Entregado'&&sameDay(o.entregado,now));
  let cob=0;const porMedio={antes:0,contra:0,credito:0};for(const o of S.orders)for(const a of o.abonos)if(sameDay(a.fecha,now)){cob+=a.monto;porMedio[o.pago]+=a.monto}
  const s=stats();
  return [`Cierre de caja ${new Date().toLocaleDateString('es')} - ${S.cfg.negocio}`,'',`Pedidos recibidos hoy: ${S.orders.filter(o=>sameDay(o.creado,now)).length}`,`Pedidos entregados: ${hoy.length}`,`Ventas entregadas: ${m(hoy.reduce((a,o)=>a+o.total,0))}`,`Ganancia estimada: ${m(hoy.reduce((a,o)=>a+ganancia(o),0))}`,'',`Cobrado hoy: ${m(cob)}`,`  Pagos por adelantado: ${m(porMedio.antes)}`,`  Contra entrega: ${m(porMedio.contra)}`,`  Abonos de crédito: ${m(porMedio.credito)}`,'',`Pendiente por cobrar total: ${m(s.calle)}`,`Pedidos en curso: ${s.porEstado.reduce((a,b)=>a+b[1],0)}`,`Atrasados: ${s.atrasados.length}`].join('\n')+firma();
}

function compress(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);let u=c.toDataURL('image/webp',.85);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');res(u)};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

document.addEventListener('input',e=>{const id=e.target.id;if(['cn','ct','cd','cnote'].includes(id))S[id]=e.target.value;if(id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});

 <h3>¿WhatsApp llena la app solo?</h3>
 <p>No del todo, y es a propósito: no usamos la API pagada de WhatsApp, así la app cuesta un solo pago y no una mensualidad. Los mensajes que genera la app llegan ordenados y con enlaces: tú tocas el enlace o pegas el mensaje una vez, y la app hace el resto.</p>
 <h3>Tus datos</h3><p>Se guardan solo en este dispositivo. Haz un respaldo de vez en cuando: se descarga como archivo y lo puedes guardar en Drive o enviártelo por WhatsApp.</p>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="bk">Descargar respaldo</button><button class="nx-btn" data-nx="rs">Restaurar desde archivo</button></div>`);
}
function apps(){
 const list=APPS.filter(a=>a.id!==me.id);
 modal(`<h2>Más apps de Neuroactiva Labs</h2>
 <p class="nx-mut">Cada app se compra por separado, en un solo pago. Ninguna desbloquea a otra ni a SixSaaS. Descarga la versión gratis o cómprala aquí.</p>
 <div class="nx-grid">${list.map(a=>`<div class="nx-card"><img src="${L[a.id]}" alt=""><b>${esc(a.n)}</b><span class="nx-mut">${esc(a.d)}</span>${a.t.length?`<span class="nx-tag">Desde US$${a.t[0][1].toFixed(2)} · pago único</span>`:''}
 <div class="nx-row" style="margin-top:0"><a class="nx-btn" href="${esc(FREE(a.id))}" target="_blank" rel="noopener">⬇ Descargar gratis</a>${a.t.length?`<button class="nx-btn nx-pri" data-nx="buy" data-id="${a.id}">Comprar</button>`:`<a class="nx-btn nx-pri" href="${esc(wa('Hola Neuroactiva Labs 👋 Quiero información de SixSaaS Full.'))}" target="_blank" rel="noopener">Consultar</a>`}</div></div>`).join('')}</div>`);
}
function buy(id){
 const a=APPS.find(x=>x.id===id);if(!a)return;
 const msg=`Hola Neuroactiva Labs 👋 Quiero ${a.n} (pago único).\nPlan: \nYa pagué por: (PayPal / Yappy)\nTe envío el comprobante 👇`;
 modal(`<h2>Comprar ${esc(a.n)}</h2><p class="nx-mut">Pago único, sin suscripción. Clientes ilimitados en todos los planes de pago.</p>
 <h3>1. Paga por PayPal o Yappy</h3>
 <div class="nx-row">${a.t.map(([n,p])=>`<a class="nx-btn nx-pri" href="${esc(NXPAY.PAYPAL+'/'+p.toFixed(2)+'USD')}" target="_blank" rel="noopener">${esc(n)} · US$${p.toFixed(2)} con PayPal</a>`).join('')}</div>
 <p style="margin-top:12px"><b>Yappy:</b> ${esc(NXPAY.YAPPY)} a nombre de ${esc(NXPAY.YAPPY_NOMBRE)}</p>
 <div class="nx-row">${NXPAY.YAPPY_URL?`<a class="nx-btn" href="${esc(NXPAY.YAPPY_URL)}" target="_blank" rel="noopener">Pagar con Yappy</a>`:`<button class="nx-btn" data-nx="yappy">Copiar número de Yappy</button>`}</div>
 <h3>2. Envía tu comprobante por WhatsApp</h3><p>Manda la captura del pago y te respondemos con un <b>enlace de activación</b>: lo abres en tu teléfono y la app queda activada. Sin copiar códigos.</p>
 <div class="nx-row"><a class="nx-btn nx-wa" href="${esc(wa(msg))}" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a><button class="nx-btn" data-nx="apps">← Ver otras apps</button></div>`);
}
/* ---- Respaldo en archivo ---- */
function backup(){
 let framed=false;try{framed=window.top!==window}catch(e){framed=true}
 if(framed){modal(`<h2>Respaldo</h2><p>En esta vista previa el navegador no permite descargar archivos. En la app instalada (o abierta desde su enlace propio) este botón descarga tu respaldo como archivo, sin copiar códigos.</p><p class="nx-mut">Mientras tanto, tus datos siguen guardados en este dispositivo.</p>`);return}
 const data={};(C.keys||[]).forEach(k=>{const v=localStorage.getItem(k);if(v!=null)data[k]=v});
 const txt=JSON.stringify({neuro:me.id,v:1,fecha:new Date().toISOString(),data});
 const name=`respaldo-${me.id}-${new Date().toISOString().slice(0,10)}.json`;
 const blob=new Blob([txt],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
 toast('Respaldo descargado: '+name);
}
function restore(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{const o=JSON.parse(await f.text());
  if(o&&o.data&&typeof o.data==='object'){if(o.neuro&&o.neuro!==me.id)return toast('Ese respaldo es de otra app');Object.entries(o.data).forEach(([k,v])=>{if((C.keys||[]).includes(k))localStorage.setItem(k,v)})}
  else if(C.keys&&C.keys[0]){localStorage.setItem(C.keys[0],JSON.stringify(o))}
  toast('Respaldo restaurado');setTimeout(()=>location.reload(),700)}catch(e){toast('Ese archivo no es un respaldo válido')}};
 i.click();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='close')close();else if(k==='flujo'){e.preventDefault();flujo()}else if(k==='apps'){e.preventDefault();apps()}else if(k==='buy')buy(b.dataset.id);
 else if(k==='flyer'){e.preventDefault();b.dataset.id?buy(b.dataset.id):apps()}
 else if(k==='bk')backup();else if(k==='rs')restore();
 else if(k==='yappy'){const n=NXPAY.YAPPY.replace(/\D/g,'');(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast('Número de Yappy copiado: abre Yappy y pégalo'),()=>toast('Yappy: '+NXPAY.YAPPY))}
},true);
/* ---- Versión gratis: prueba por días de uso, compra y activación por enlace ---- */
const FREE_DAYS=7;
const PUBJWK={key_ops:['verify'],ext:true,kty:'EC',x:'L58SCsJZhUeCDLz1ZhYOe79DoHNDObKSF4KftJ38Mbw',y:'jZYVUqlgVp59nI0Pnm46tO0Jkffe7qLsYO1bq6JRVKg',crv:'P-256'};
const LK='nx-lic:'+me.id, UK='nx-uso:'+me.id;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const b64u=s=>{const b=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b.padEnd(Math.ceil(b.length/4)*4,'='));return Uint8Array.from(bin,c=>c.charCodeAt(0))};
async function verify(raw){try{const key=String(raw||'').trim().replace(/\s+/g,'');const [v,p,s]=key.split('.');if(v!=='SXS1'||!p||!s)return null;
 const pub=await crypto.subtle.importKey('jwk',PUBJWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pub,b64u(s),new TextEncoder().encode(v+'.'+p)))return null;
 const d=JSON.parse(new TextDecoder().decode(b64u(p)));if(d.m!==me.id)return null;if(d.e&&new Date(d.e+'T23:59:59')<new Date())return null;return {key,d}}catch(e){return null}}
const usedDays=()=>{try{return JSON.parse(ls.get(UK)||'[]')}catch(e){return []}};
function markUse(){const d=new Date().toISOString().slice(0,10),u=usedDays();if(!u.includes(d)){u.push(d);ls.set(UK,JSON.stringify(u))}return u.length}
let licensed=false;
async function activar(raw,silent){const r=await verify(raw);if(!r){if(!silent)toast('Ese enlace o código no es válido para '+me.n+'. Escríbenos por WhatsApp.');return false}
 ls.set(LK,r.key);licensed=true;close();unlockUI();toast('¡Listo! '+me.n+' activada para siempre en este dispositivo.');return true}
function unlockUI(){const l=document.querySelector('.nx-lock');if(l)l.remove();const c=document.querySelector('.nx-chip');if(c){c.textContent='✓ Activada';c.dataset.nx='';}}
function activarUI(){modal(`<h2>Activar ${esc(me.n)}</h2><p>Cuando confirmamos tu pago te enviamos por WhatsApp un <b>enlace de activación</b>. Ábrelo en este teléfono o computadora y la app queda activada sola. No tienes que copiar nada.</p>
 <div class="nx-row"><button class="nx-btn nx-pri" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><a class="nx-btn nx-wa" href="${esc(wa('Hola Neuroactiva Labs 👋 Ya pagué '+me.n+' y necesito mi enlace de activación.'))}" target="_blank" rel="noopener">Pedir mi enlace</a></div>
 <details style="margin-top:14px"><summary class="nx-mut" style="cursor:pointer">¿El enlace no abrió la app?</summary><p class="nx-mut">Mantén presionado el mensaje que te enviamos, toca Copiar y pégalo aquí completo.</p><textarea id="nxAct" style="width:100%;min-height:70px;background:#05070a;color:#eaf4f8;border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:8px;font:14px Inter,system-ui"></textarea><div class="nx-row"><button class="nx-btn" data-nx="actgo">Activar</button></div></details>`)}
function lockScreen(){if(document.querySelector('.nx-lock'))return;const o=document.createElement('div');o.className='nx-ov nx-lock';
 o.innerHTML=`<div class="nx-box" role="dialog" aria-modal="true" style="text-align:center"><img src="${L[me.id]}" alt="" style="width:84px;height:84px;border-radius:50%"><h2 style="padding:0;margin-top:8px">Terminó tu prueba gratis de ${esc(me.n)}</h2><p>Usaste tus ${FREE_DAYS} días de uso gratis. Tus datos siguen guardados en este dispositivo: activa la app para seguir usándola, sin límite de clientes y con un solo pago.</p>
 <div class="nx-row" style="justify-content:center"><button class="nx-btn nx-pri" data-nx="buy" data-id="${me.id}">Comprar ${esc(me.n)}</button><button class="nx-btn" data-nx="act">Ya pagué: activar</button><button class="nx-btn" data-nx="bk">Descargar respaldo</button></div></div>`;
 document.body.appendChild(o)}
async function freeInit(){
 const m=(location.hash||'').match(/activar=(SXS1\.[\w.-]+)/)||(location.search||'').match(/activar=(SXS1\.[\w.-]+)/);
 if(m){await activar(m[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}
 if(!licensed){const k=ls.get(LK);if(k&&await verify(k))licensed=true}
 const chip=document.querySelector('.nx-chip');
 if(licensed){unlockUI();return}
 const n=markUse(),left=Math.max(0,FREE_DAYS-n+1);
 if(chip)chip.textContent=left>0?`Gratis: ${left} de ${FREE_DAYS} días de uso`:'Prueba terminada';
 if(n>FREE_DAYS)lockScreen();
}
/* Instalar como app */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.querySelector('[data-nx=inst]');if(b)b.hidden=false});
function instalar(){if(deferred){deferred.prompt();deferred=null;return}
 modal(`<h2>Instalar ${esc(me.n)}</h2><p><b>Android (Chrome):</b> menú ⋮ → <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</p><p><b>iPhone (Safari):</b> botón Compartir → <b>Agregar a inicio</b>.</p><p><b>Computadora (Chrome o Edge):</b> ícono de instalar en la barra de direcciones.</p><p class="nx-mut">Queda como una app más y funciona sin conexión.</p>`)}
if(C.free&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nx]');if(!b)return;const k=b.dataset.nx;
 if(k==='act')activarUI();else if(k==='actgo'){const v=(document.getElementById('nxAct')||{}).value||'';const mm=v.match(/SXS1\.[\w.-]+/);mm?activar(mm[0]):toast('No encontré la activación en ese texto')}
 else if(k==='inst')instalar();
},true);

const bar=document.createElement('div');bar.className='nx-bar';bar.innerHTML=(C.free?`<button class="nx-chip" data-nx="act">Versión gratis</button><button data-nx="inst">⬇ Instalar</button>`:'')+`<button data-nx="flujo">¿Cómo llegan mis clientes?</button><button data-nx="bk">Respaldo</button><button data-nx="apps">✦ Más apps</button>`;
document.body.insertBefore(bar,document.body.firstChild);
if(C.free)freeInit();
window.NX={flujo,apps,buy,backup,restore};
})();
</script>
